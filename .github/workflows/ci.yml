# Gate for main: every pull request and every push runs the build check and the test suites
# that finish in under an hour. The assistant browser suite (about 50 minutes) runs nightly
# and on demand.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Built page matches the source
        run: git diff --exit-code -- docs/index.html || (echo "docs/index.html is stale. Run npm run build and commit it." && exit 1)
      - run: npm run test:static
      - run: npm run test:floating
      - run: npm run test:e2e
      - run: npm run test:companion

  assistant:
    name: Assistant browser suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:assistant
