.setup-foot { flex: none; padding: var(--s3) var(--s4) max(var(--s4), env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
.signin { font-size: var(--text-sm); line-height: 20px; color: var(--ink-2); }

.setup details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0 var(--s4); }
.setup details[open] { padding-bottom: var(--s4); }

.presenter-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 40; animation: fade var(--motion-base); }
.presenter { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); }
.presenter-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s2) var(--s2) var(--s2) var(--s4); border-bottom: 1px solid var(--line); }

.as-launcher { position: absolute; right: var(--s4); bottom: var(--as-bottom, 84px); z-index: 20; display: inline-flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s4); border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: var(--text-sm); box-shadow: var(--shadow-2); cursor: pointer; }

mples:"Compliance sets the limit and the {order} screen applies it before a request can be sent. A drop counts only with a signed receipt. The agents never suggest samples above the limit, and never link a sample to a request."},assistantRefusals:[{id:"ref-clinical",guardrail:"all2",patterns:["dose","dosage","dosing","side effect","contraindicat","safe for","safety of","interaction with","pregnan","which patients","should a patient","prescribe"],refusal:"I cannot answer clinical questions such as dosing, safety or who a product suits.",allowed:"I can log it as a Medical Information request and show the approved material for this product."},{id:"ref-claims",guardrail:"all1",patterns:["better than","works better","more effective","efficacy","superior","outperform","off-label","off label"],refusal:"I do not write claims or comparisons, and I never suggest off-label content.",allowed:"I can show which approved material covers this product."},{id:"ref-sample",guardrail:"gap1",patterns:["extra samples","more samples","without a signature","skip the signature","sign for them","unsigned"],refusal:"I cannot suggest samples above the limit or a drop without a signed receipt.",allowed:"I can show the limit and what is still needed to record a drop."},{id:"ref-inducement",guardrail:"order1",patterns:["gift","free goods","free trip","hospitality for","incentive for the","discount"],refusal:"I do not suggest anything that could be an inducement.",allowed:"I can show what the approved education meeting offers and how attendance is logged."},{id:"ref-contact",guardrail:"planner1",patterns:["personal mobile","private number","call them at home","after hours call"],refusal:"I do not plan contact that breaks the local rules on reaching an {contact}.",allowed:"I can show the best slot in the practice diary and the route for today."}]};var ua={companion:{roles:{rep:"Medical rep",manager:"Area manager"},expenseCategories:[{id:"fuel",label:"Fuel and tolls",limitClass:"travel"},{id:"parkin :"humanPrice",text:"Service contract pricing is set by the contracts team. The agent only records interest."},{kind:"info",text:"Claims follow the instructions for use and approved materials only."}],overrideReasons:[{label:"Surgeon changed the case plan",route:"manager"},{label:"OR access not granted today",route:"manager"},{label:"Contract under negotiation",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Stakeholder not available",blocked:!1},{label:"Item on back order",blocked:!0},{label:"Purchase order on hold",blocked:!0,route:"kam"},{label:"Case cancelled",blocked:!1}],visitNotes:[{text:"Case supported. Sizes confirmed the day before.",segments:["hosp","asc"]},{text:"Consumables reordered, {n} lines.",segments:["hosp","asc"]},{text:"In-service run, {n} staff signed.",segments:["hosp","asc"]},"Complaint facts collected and logged.",{text:"Service renewal discussed with procurement.",segments:["hosp","lab"]},{text:"Analyzer maintenance log reviewed with the lab manager.",segments:["lab"]}],kpis:[{id:"pull",label:"Consumable pull-through vs plan",format:"pct",range:[62,104],target:95,segments:["hosp","asc"]},{id:"renew",label:"Contracts renewed on time",format:"pct",range:[70,98],target:95},{id:"cases",label:"Supported cases this quarter",format:"count",range:[2,14],target:10,segments:["hosp","asc"]},{id:"complaints",label:"Open device complaints",format:"count",range:[0,4],target:0,lowerIsBetter:!0},{id:"uptime",label:"Installed base uptime",format:"pct",range:[91,99],target:98}],guardrails:[{id:"all1",agent:"all",text:"Approved claims only. Product use follows the instructions for use."},{id:"planner1",agent:"planner",text:"Case support is logged. The territory manager never makes clinical decisions."},{id:"order1",agent:"order",text:"Never sets contract prices or terms. The contracts team does."},{id:"gap1",agent:"gap",text:"Device complaints go to the quality team within 24 hours."}],problems:[{title:"High-volume accounts get the same attention as quiet ones",text:"Visit plans follow relationships. Accounts with the most procedures are not always the ones we see most.",capability:"potential"},{title:"Consignment shelves run out and we hear it from the surgeon",text:"Nobody sees the gap between usage and stock until a case is delayed.",capability:"gaps"},{title:"Capital deals crowd out pull-through",text:"Territory managers chase the next big sale while consumable use at installed accounts drifts.",capability:"ranking"},{title:"Case support clashes with everything else",text:"Cases are booked late. The rest of the week gets rebuilt by hand each time.",capability:"planning"},{title:"Reorders depend on someone remembering",text:"OR managers order when they notice. We find out about a shortage after it happens.",capability:"order"},{title:"We cannot show the support we gave",text:"Training sign-offs, case support and complaint follow-ups live in notes and email.",capability:"evidence"}],assistant:[{q:"Which accounts are behind on consumable pull-through?",a:"The installed accounts where usage is below plan. The Gap agent ranks those reorders first today."},{q:"Can I tell the surgeon which size to use?",a:"No. Sizing and clinical choices belong to the surgeon. You confirm what is on site and how the product works."},{q:"How do I renew a service contract?",a:"Start the renewal from the order screen. The contracts team sets the price and sends the offer."},{q:"Why is this lab on today's plan?",a:"Its analyzer logged unplanned stops and reagent stock is low. Both are fixable in one visit."},{q:"What should I do with a device complaint?",a:"Collect the lot number and what happened, log it, and tell the stakeholder when quality will reply. Do not guess the cause."},{q:"What happens when I override an item?",a:"It goes to your regional sales manager with your reason. It is feedback for the agents, not a mark against you."},{q:"When does the value analysis committee meet?",a:"The date and the open questions are on the hospital account page."},{q:"How sure is the agent about the consignment gap?",a:"Each item shows a confidence level. Low confidence means the usage data is incomplete. Count before acting."}],storyline:["Pick Medical devices and the prospect's country. Say it is sample data.","Today: the territory manager's visits across hospitals, surgery centers and labs, ranked by value.",'Open the first brief. Approve the case support item. Override one with "Contract under negotiation".',"Open an action: why it matters, talking points, and the guardrail on clinical decisions.","Order: show the service contract line priced by people, and the sign-off limit.","Finish the visit, then switch to the regional sales manager. The override is routed to the key account manager.","Agent controls: authority levels and the stop button.",'How this is configured: stakeholders, products, actions and KPIs. "A configuration, not a custom build."'],forbidden:["store","stores","shopper","SKU","dealer","merchant","workshop","planogram","farmer","HCP","promo","loan"]};var ya={assistantContext:z({today:{rep:[{q:"Which {accounts} could host an activation night?",intent:"answer:todayActivation"}]},brief:{rep:[{q:"What does the outlet license allow?",intent:"answer:briefLicense"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"How much keg stock is too much?",intent:"answer:orderKeg"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"When is the best time to visit a bar?",intent:"answer:routeService"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"What does the agent do about age checks?",intent:"answer:agentsAge"}],manager:[{q:"What does the agent do about age checks?",intent:"answer:agentsAge"}]}}),assistantAnswers:{talkToContact:"Visit before service, pour a drink the way it should be served, and ask what is not selling. Offer menu design help and staff training under the trade agreement, not stock or favours. Staff must know how to check age and refuse service.",goodVisit:"A good {visit} happens before service. You check the pour and the lines, agree one listing or activation, confirm the age-check signs are up, photograph what changed, and leave a {order} that covers the next two weekends and no more.",guardrailWhy:"This assistant follows responsible marketing, local licensing and age rules before any sales suggestion.",todayActivation:"The best candidates are bars and hotels with no event booked before the next holiday, steady sales and a manager who answers. The planner lists them in the brief with the date to book by. Every activation follows responsible marketing rules.",briefLicense:"Each {account} holds its own license, with its own hours and limits. Check that an event is covered before you plan it. The agent never suggests anything that would break local licensing, and licensing rules come before any suggestion.",orderKeg:"More than about two weekends of expected sales. Kegs go off, and a full cold room hides a problem with the lines. The draft is built from weekend sales and days left on the current keg, so it will not load the {account}.",routeService:"Before evening service, between lunch and dinner. The manager has time then and the bar is quiet enough to check the lines. A visit during service wastes both of your time.",managerKam:"The ones with an exclusive supply contract with another brand, and hotels with several outlets. Those need a decision at group level, not a coaching note to the {rep}.",agentsAge:"The agent reminds the {account} to display age-check signs and to check ID. It never aims marketing at anyone under the legal drinking age, and an activation brief always includes the er?",text:"About two weekends of expected sales. The draft uses weekend sales and days left on the current keg. More than that spoils and hides problems with the lines."},{id:"k5",title:"What do I do if I see an under-age sale?",text:"Remind the {contact} of the age-check rule, give them the signs, and tell your {manager}. The {account} is responsible for its license, and you protect the brand."},{id:"k6",title:"How do I ask for a cooler placement?",text:"Agree the location and the power point with the {contact}, explain the purity terms before signing and photograph the placement for the audit."},{id:"k7",title:"What can I offer to win a menu listing?",text:"Menu design help and staff training under the trade agreement. Nothing in cash and no free stock. Ask your {kam} if the {contact} asks for more."},{id:"k8",title:"How do I handle a hotel with several outlets?",text:"Find out who decides across outlets, usually the food and beverage manager, and keep each bar manager informed. Escalate group decisions to your {kam}."},{id:"k9",title:"When should I visit a bar?",text:"Between lunch and evening service. The {contact} has time and the bar is quiet enough to check the lines. A {visit} during service helps nobody."},{id:"k10",title:"Can I claim glassware I buy locally?",text:"Yes, inside the sample limit, with a receipt, for serve materials used at an approved activation. Keep the activation reference."},{id:"k11",title:"What is the right way to pour a draught drink?",text:"Hold the glass at an angle, fill steadily, finish upright and check clarity and head. Serve with a clean glass. Use the brand serve guide for the details."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start with the pour or the menu: it is the clearest gap to fix together."},{id:"p2",uses:["offer"],text:"There is room to list {offer} in a small way. Suggest a trial and agree a review date with {person}."},{id:"p3",uses:["trend","e oday:{rep:[{q:"Which {accounts} need pre-season stock first?",intent:"answer:todayStock"}]},brief:{rep:[{q:"What does the product label cover?",intent:"answer:briefLabel"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"How is a season {order} different from a normal one?",intent:"answer:orderSeason"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"When is the best time to see a grower?",intent:"answer:routeCrop"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Who decides credit for a {account}?",intent:"answer:agentsCredit"}],manager:[{q:"Who decides credit for a {account}?",intent:"answer:agentsCredit"}]}}),assistantAnswers:{talkToContact:"Ask about the crop and the stage before you talk about a product. Read the label together if the question is about a spray: crop, pest, rate, interval and protective equipment. If it is not on the label, do not recommend it, and point to the agronomist.",goodVisit:"A good {visit} is timed to the crop. You walk the plot or the shelf, check stock against the season plan, give advice only from the label and log it, train the counter if needed, and agree dates for dues and the next {visit}.",guardrailWhy:"This assistant follows the product label for crop protection and leaves credit and agronomy decisions to people.",todayStock:"{Accounts} with the fewest days of cover against expected season demand come first. The Order agent plans the stock in two drops, so the {account} is not carrying everything at once. The brief shows days of cover for each line.",briefLabel:"The label lists the crops, pests, rates, intervals before harvest and the protective equipment. The app does not restate them. Read the printed label on the pack. For anything it does not cover, ask the agronomist.",orderSeason:"A season {order} follows the planting area and the sowing date, in two drops. A normal {order} follows the last few weeks of sales. The reasons on each line say which one applies. Neither goes above expected demand.",routeCrop:"Around the crop stage: sowing, early growth and flowering are when decisions are made. The planner uses the sowing date you recorded. Rain can move it, and the route re-plans when you mark a stop closed.",managerKam:"The ones on credit hold, cooperatives with a member program waiting for approval, and any {account} where field work stopped for weather. Those need a decision at account level.",agentsCredit:"People decide. Credit teams set terms and limits. The agent can share a statement and help agree a payment date. It never extends credit or changes a limit."},assistantRefusals:[{id:"ref-label",guardrail:"all1",patterns:["what dose","dosage","how much to spray","tank mix","spray rate","off-label","off label","can i use it on"],refusal:"Crop protection advice follows the product label only. I do not state rates or uses.",allowed:"I can point to the label on the pack and to the agronomist for anything it does not cover."},{id:"ref-credit",guardrail:"all2",patterns:["extend credit","more credit","raise the credit","credit limit to","approve credit","waive the"],refusal:"I cannot extend or change credit. People decide.",allowed:"I can show the season statement and help agree a payment date."},{id:"ref-yield",guardrail:"gap1",patterns:["yield will","how much yield","guarantee","promise a yield","increase my yield by","extra bags"],refusal:"I do not promise yield. Demo plot results are observations from one field.",allowed:"I can show the plot photos and what they record, as observations."},{id:"ref-stock",guardrail:"order1",patterns:["stock above","load the dealer","overstock","push extra bags","dump stock"],refusal:"I do not plan season stock above expected demand.",allowed:"I can show how the season plan was worked out and how the two drops are split."}]};var Ca={companion:{roles:{rep:"Field sales officer",manager:"Area manager"},expenseCategories:[{id:"fuel",label:"Fuel for field travel",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"meeting",label:"Farmer meeting setup costs",limitClass:"other"},{id:"demo",label:"Demo plot signs and markers",limitClass:"other"},{id:"lodging",label:"Overnight stay for a distant visit",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"label",label:"Product label and safe use",cycleMonths:12},{id:"steward",label:"Product stewardship",cycleMonths:12},{id:"protect",label:"Protective equipment and storage",cycleMonths:12},{id:"counterfeit",label:"Spotting look-alike packs",cycleMonths:12},{id:"driving",label:"Safe driving on rural roads",cycleMonths:24}],learningModules:[{id:"m1",title:"Reading a product label together",minutes:20,summary:"Crop, pest, rate, interval and protective equipment, in the order the label lists them."},{id:"m2",title:"Planning pre-season stock",minutes:20,summary:"Days of cover against expected demand, in two drops."},{id:"m3",title:"Running a demo plot visit",minutes:25,summary:"Photograph at each stage and describe what you see as an observation."},{id:"m4",title:"Running a farmer meeting",minutes:25,summary:"Approved flipchart, safe storage and use, and notes on who attended."},{id:"m5",title:"Talking about dues without changing credit",minutes:15,summary:"Share the statement, agree a date and leave limits to the credit team."},{id:"m6",title:"Training counter staff on the label",minutes:15,summary:"Line by line, then ask the trainee to explain it back."},{id:"m7",title:"Checking batch codes",minutes:10,summary:"Scan, compare with the register and report anything that does not match."},{id:"m8",title:"Timing a visit to crop stage",minutes:15,summary:"Use the sowing date and plan around flowering."},{id:"m9",title:"Member programs with a cooperative",minutes:20,summary:"Delivery points, dates and what needs {manager} approval."}],knowledge:[{id:"k1",title:"How do I give advice on a product?",text:"Read the label with the {contact}: crop, pest, rate, interval and protective equipment. If the crop or the pest is not on the label, do not recommend the product. Ask the agronomist."},{id:"k2",title:"How do I plan season stock for a {account}?",text:"Start from expected demand and sowing dates, plan in two drops, and never above expected demand. The {order} reasons show days of cover for each line."},{id:"k3",title:"What do I do at a demo plot?",text:"Photograph the plot at the agreed stage, note the label rate that was used and describe the result as an observation from one field. Never describe it as a promise."},{id:"k4",title:"Who decides credit for a {account}?",text:"The credit team. Share the season statement and agree a payment date. Do not change credit terms or promise a new limit."},{id:"k5",title:"How do I spot a look-alike pack?",text:"Scan the batch code against the register and compare the print and the seal. If the code is not in the register, photograph the pack, report it and do not sell it."},{id:"k6",title:"How do I run a farmer meeting?",text:"Use the approved flipchart and the product label. Cover safe storage, mixing and protective equipment. Record who attended and leave your contact details."},{id:"k7",title:"When is the best time to see a grower?",text:"Around the crop stage: sowing, early growth and flowering. The planner uses the sowing date you recorded and re-plans when rain stops field work."},{id:"k8",title:"What do I do if rain stops field work?",text:"Use Mark closed today on the {visit}, tell the {contact} and book the next slot. The route re-plans the rest of the day."},{id:"k9",title:"How do I train counter staff?",text:"Walk the label line by line, role-play one customer question and ask the trainee to explain the rate and the interval back. Record the signed sheet."},{id:"k10",  farmer?",a:"Around flowering, based on the sowing date. The Visit Planner books it."},{q:"Do the demo plot results promise a yield?",a:"No. They are observations from one field, shown as sample data in this demo."}],storyline:["Pick Agri inputs and the prospect's country. Say it is sample data.","Today: dealers, a cooperative and farms, ranked by value in local currency.",'Open the first brief. Approve the pre-season stock plan. Override one with "Rain stopped field work".',"Open the label advice action: the label guardrail, talking points, evidence.","Order: raise the season quantity and show the approval limit and the credit rule.","Finish the visit, then switch to the area manager. The override is in the exception queue.","Agent controls: label and credit guardrails. Stop the Order agent.",'How this is configured: customers, products, actions and KPIs. "A configuration, not a custom build."'],forbidden:["HCP","clinic","physician","prescriber","formulary","merchant","workshop","planogram","SKU","shopper","loan"]};var Ta={assistantContext:z({today:{rep:[{q:"Which {accounts} will run out of float today?",intent:"answer:todayFloat"}]},brief:{rep:[{q:"What does KYC need at the counter?",intent:"answer:briefKyc"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why is there a float cap?",intent:"answer:orderFloat"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"When is the evening recharge peak?",intent:"answer:routePeak"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"What does the agent do about KYC?",intent:"answer:agentsKyc"}],manager:[{q:"What does the agent do about KYC?",intent:"answer:agentsKyc"}]}}),assistantAnswers:{talkToContact:"Visit before the evening rush, when the owner can talk. Check float and SIM stock first, then branding. Ask how many customers were turned away this week, and show the KYC records that are incomplete. Plans are matched to how the customer actually uses the phone.",goodVisit:"A good {visit} is short and leaves the counter ready for the peak. Float is topped up within the limit, SIM kits are counted and logged, incomplete KYC records are shown to the {contact}, and branding is fresh. You photograph what changed.",guardrailWhy:"This assistant never skips a KYC check, never creates a price, and never suggests a plan the customer does not need.",todayFloat:"{Accounts} whose float balance covers only a few hours at today's rate come first. The brief shows the balance and the usual evening pattern. The top-up stays within the distributor limit.",briefKyc:"A valid ID and the live photo, scanned and complete before any activation. The {contact} completes the record with the customer. You check records and never edit them. If an ID is missing, the SIM is not activated.",orderFloat:"The distributor sets a float limit for each {account}. A higher float is a credit risk for the {account} and for the distributor. The draft tops up to the usual weekly level and never above the limit.",routePeak:"Most {accounts} peak in the evening, after work. Visits before the peak leave the counter ready, and a top-up lands before the busiest hours. Check the hourly pattern in the brief for each {account}.",managerKam:"The ones under a KYC review, outlets suspended for incomplete records, and any {account} with a float limit set by the distributor. Those need a decision at account level.",agentsKyc:"The agent lists activations with incomplete records and asks you to check them with the {contact}. It never skips a check, never edits a record, and never suggests activating without a valid ID."},assistantRefusals:[{id:"ref-kyc",guardrail:"all1",patterns:["skip kyc","without id","without an id","forgot their id","bypass kyc","activate without","fake id"],refusal:"No activation without a valid ID. I never skip a KYC check.",allowed:"I can show which records are incomplete and what the customer needs to bring."},{id:"ref-tariff",guardrail:"all2",patterns:["special price","custom price","discount","free data","extra validity","create a plan","change the tariff"],refusal:"Prices and offers follow the published tariff. I cannot create one.",allowed:"I can show the published offers for this period."},{id:"ref-selling",guardrail:"gap1",patterns:["without telling","do not mention","force the customer","unwanted plan","upsell without"],refusal:"I do not suggest anything that would mislead a customer.",allowed:"I can show how to match a plan to how the customer uses the phone."},{id:"ref-float",guardrail:"order1",patterns:["beyond the cap","raise the float cap","float cap to","more float than","above the float limit"],refusal:"I never top up float above the distributor limit.",allowed:"I can show the limit for this {account} and the usual weekly level."}]};var Aa={companion:{roles:{rep:"Channel sales rep",manager:"Zonal sales manager"},expenseCategories:[{id:"fuel",label:"Fuel for beat visits",limitClass:"travel"},{id:"parking",label:"Parking",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"branding",label:"Signage and branding materials",limitClass:"other"},{id:"lodging",label:"Overnight stay for a zone visit",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"kyc",label:"KYC rules and record checks",cycleMonths:12},{id:"tariff",label:"Published tariff and offer rules",cycleMonths:6},{id:"privacy",label:"Customer data privacy",cycleMonths:12},{id:"fair",label:"Fair selling and no mis-selling",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24}],learningModules:[{id:"m1",title:"KYC at the counter",minutes:20,summary:"Valid ID, the live photo and what to do when a customer has no ID with them."},{id:"m2",title:"Float and the distrib p manager.","Agent controls: never sets price, never approves credit. Stop the Order agent.",'How this is configured: merchants, proposals, actions and KPIs. "A configuration, not a custom build."'],forbidden:["store","stores","SKU","SKUs","shelf","shopper","HCP","clinic","physician","prescriber","formulary","dealer","workshop","patient","farmer","planogram","promo"]};var Ha={assistantContext:z({today:{rep:[{q:"Which {accounts} are about to change menu?",intent:"answer:todayMenu"}]},brief:{rep:[{q:"What does the supply contract allow here?",intent:"answer:briefContract"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why not phone in the usual {order}?",intent:"answer:orderUsual"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"What if the kitchen is in service?",intent:"answer:routeService"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Can an agent give an allergen answer?",intent:"answer:agentsAllergen"}],manager:[{q:"Can an agent give an allergen answer?",intent:"answer:agentsAllergen"}]}}),assistantAnswers:{talkToContact:"Start in the kitchen, not at the desk. Ask what is on the pass this week, listen for what is hard to source, and offer one thing that helps before you mention anything new. Keep it short: service starts soon.",goodVisit:"A good {visit} fits between services and ends with something agreed in writing: a sample, a spec sheet handed over, a standing order or a menu date. Count the store room, fix the top item, and leave an {order} that matches what the kitchen really uses.",guardrailWhy:"This assistant follows the contract price list and the rules your company set for the agents.",todayMenu:"Look for {accounts} where the menu changes within a few weeks and a new product has not been trialed. The menu action in each brief shows the timing and how similar {accounts} in the same area did. Offer a sample case and a cost per portion.",briefContract:"The supply contract sets prices, delivery days and minimum {order} sizes. The agent never suggests terms outside it. If the {contact} asks for more, log it and raise it with your {kam}.",orderUsual:"Phoning in the usual {order} keeps the range flat and misses seasonal peaks. The draft starts from the weekly average and the days of cover from the last count, then adds focus and new lines the kitchen has a dish for. You can change every line.",routeService:"If the kitchen is in service, move that {visit} to the quiet window after it. Use Mark closed today and the route re-plans. A short call after service beats a long wait at the back door.",managerKam:"The ones with overrides that cite the supply contract, and hotels or caterers with a blocked action. Those need a decision at account level, not a coaching note to the {rep}.",agentsAllergen:"No. Allergen and nutrition statements come only from the current spec sheet. An agent can remind the {rep} to hand over the sheet, and a person answers anything the sheet does not cover."},assistantRefusals:[{id:"ref-allergen",guardrail:"gap1",patterns:["is it gluten free","free from nuts","safe for allergies","allergen status","contains no nuts","vegan certified"],refusal:"I cannot make allergen or nutrition statements. Those come only from the spec sheet.",allowed:"I can remind you to hand over the current spec sheet and log a question it does not cover."},{id:"ref-terms",guardrail:"all1",patterns:["discount","lower price","special price","free case","side deal","rebate for","match their price"],refusal:"I cannot suggest prices or terms outside the contract price list.",allowed:"I can show what the contract allows and who to ask for an exception."},{id:"ref-load",guardrail:"order1",patterns:["stock them up","load the store room","overstock","push extra cases","fill their freezer","month end push"],refusal:"I do not plan stock beyond what the venue can store and use before the date code.",allowed:"I can show how the quantity was worked out and the days of cover from the last count."},{id:"ref-key",guardrail:"planner1",patterns:["drop this venue","remove the hotel","skip the caterer","stop visiting"],refusal:"I do not drop a hotel or caterer on a supply contract without your {manager}.",allowed:"I can show how the day re-plans if one stop is closed."}]};var Na={companion:{roles:{rep:"Sales rep",manager:"Regional manager"},expenseCategories:[{id:"fuel",label:"Fuel",limitClass:"travel"},{id:"parking",label:"Parking and loading bay fees",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"samples",label:"Sample cases bought locally",limitClass:"other"},{id:"lodging",label:"Hotel for an overnight trip",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"foodhygiene",label:"Food hygiene for the delivery chain",cycleMonths:12},{id:"allergen",label:"Allergen awareness and spec sheets",cycleMonths:12},{id:"contract",label:"Supply contract and price list rules",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24},{id:"privacy",label:"Data privacy for field teams",cycleMonths:12}],learningModules:[{id:"m1",title:"Counting a store room in ten minutes",minutes:15,summary:"A fixed walk order for dry, chilled and frozen stock, so nothing is missed and the {contact} can follow."},{id:"m2",title:"Selling into a menu change",minutes:25,summary:"Find out the menu date early, bring a sample and a cost per portion, and agree when to call back."},{id:"m3",title:"Reading a spec sheet with a chef",minutes:20,summary:"Where the allergen table sits, what the sheet does not say, and when to log a question instead of guessing."},{id:"m4",title:"Fixing a short delivery at the root",minutes:20,summary:"Tell a stock allocation gap from a picking error, and give the {contact} a clear fix date."},{id:"m5",title:"Setting up a standing {order}",minutes:15,summary:"Choose lines with steady use, agree the cut-off day and show how to pause it."},{id:"m6",title:"Working with the {kam}",minutes:20,summary:"When to escalate a contract question and what to log so nothing is lost between teams."},{id:"m7",title:"Cold chain checks that hold up",minutes:15,summary:"Where the reading goes, what the photo must show, and what to do when a probe is missing."},{id:"m8",title:"Planning a day around service hours",minutes:15,summary:"Group calls by quiet window so each {visit} gets the {contact}'s full attention."},{id:"m9",title:"Seasonal and banquet planning",minutes:25,summary:"Use booking calendars to plan stock weeks ahead rather than on the day."}],knowledge:[{id:"k1",title:"How do I offer a sample case?",text:"Check the sample budget with your {manager}, tell the {contact} what is in the case and leave a feedback card. Log the sample so the product team can follow up on the result."},{id:"k2",title:"What counts as a valid receiving check?",text:"A temperature reading with the product, the time and the name of the person who received it, plus a photo of the log. A check without a reading cannot support a quality query."},{id:"k3",title:"Where do I find the current spec sheet?",text:"The product page holds the latest version with a date. Print it for the {contact} and ask for a signature. Never rely on an old copy from a previous visit."},{id:"k4",title:"What if the {contact} asks about an allergen?",text:"Show the allergen table on the spec sheet and read it with them. If the sheet does not answer the question, log it for the product team and tell the {contact} when to expect a reply."},{id:"k5",title:"How do I read days of cover?",text:"Days of cover is stock on hand divided by average daily use. Under about four days on a core line means order now. The {order} draft shows it for each line."},{id:"k6",title:"Who approves a large {order}?",text:"Orders above the approval limit go to your {manager}. The limit shows on the {order} screen, along with who it is waiting for."},{id:"k7",title:"What do I do about a short delivery?",text:"Log the delivery number, the line and the quantity short. Tell the depot lead the same day and give the {contact} a date for the replacement."},{id:"k8",title:"How should I log a refusal?",text:"Record the reason code, the name of the {contact} and the date. A refusal is useful data and is not a mark against you."},{id:"k9",title:"What is the right way to claim mileage?",text:"Take each trip start and end from the route plan. A claim uses the company mileage rate, in the distance unit of your country."},{id:"k10",title:"How do I prepare for a hotel or caterer {visit}?",text:"Open the {visit} brief, read the top three actions, bring the price list and spec sheets, and check the open items from the last {visit}."},{id:"k11",title:"What if the {contact} is unhappy?",text:"Listen first, write down what they say, fix what you can during the {visit} and tell your {manager} what you could not fix."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start there: it is the clearest gap in the store room."},{id:"p2",uses:["offer"],text:"{offer} could suit a dish already on the menu. Offer a sample case and agree a date with {person} to hear how it cooked."},{id:"p3",uses:["trend","event"],text:"The last {order} was {trend}. {event} is {eventDays} days away, so agree stock and delivery days for it now."}],valueStoryTemplates:[{id:"s1",title:"A steady kitchen supply",uses:["share","orderCount"],text:"{name} has captured {share} of its estimated potential. Across the last {orderCount} {orders}, the core lines were steady. The next step is to close the delivery gaps we found, one at a time, and review them together at the next {visit}."},{id:"s2",title:"A menu that moves with the season",uses:["offer","trend"],text:"The last {order} was {trend}. A trial of {offer} lets {person} test a new dish without changing the whole range, and the next {order} will show how it went."},{id:"s3",title:"Ready for the busy weeks",uses:["potential","share"],text:"Estimated potential at {name} is {potential} a year and the current figure is {current}. The gap of {whitespace} is an estimate from sample data. It is the reason to plan the busy weeks together."}],resourcePlans:[{id:"r1",name:"Seasonal menu launch",startWeek:1,weeks:3,perWeek:5},{id:"r2",name:"Spec sheet refresh round",startWeek:3,weeks:2,perWeek:4}],guardrails:[{id:"fg1",text:"Allergen and nutrition statements come only from the current spec sheet. The Companion never writes its own.",blocked:["allergen free","gluten free","safe for allergies","nut free","guarantee","no allergens"]},{id:"fg2",text:"Prices and terms follow the contract price list. Value stories use sample data and say so, and never claim a result.",blocked:["proven to","doubles sales","will boost","risk free","side deal","under the table"]}]}};var Fa={...Ha,...Na,id:"foodservice",name:"Foodservice distribution",tagline:"Restaurants, hotels, caterers and canteens",icon:"home",accent:"#047857",vocab:{account:"venue",accounts:"venues",contact:"buyer",contacts:"buyers",rep:"sales rep",reps:"sales reps",manager:"regional manager",kam:"national accounts manager",offering:"product",offerings:"products",order:"order",orders:"orders",visit:"visit",visits:"visits"},personas:{rep:"Sales rep",manager:"Regional manager",admin:"Commercial operations lead"},segments:[{id:"dining",name:"Restaurants and cafes",share:.45,visitMinutes:[15,25],style:"Quick call in the quiet hours between lunch and dinner, led by the chef's next menu change.",annualValue:[14e3,7e4],hours:[600,960],orderQty:[2,10],types:[{type:"Restaurant",words:{en:["Table","Eatery","Dining Room"],pt:["Cantina","Restaurante"],es:["Cocina","Fonda"],de:["Gasthaus","Speisehaus"],id:["Rumah Makan","Dapur"],fr:["Table","Bistrot Gourma nd pass them to the depot lead."]},{id:"spec",type:"Hand over the spec sheet",agent:"gap",effort:8,evidence:"signature",value:[60,320],uses:"focus",title:"Hand over the spec sheet for {product}",saw:"The kitchen asked about {product} and no spec sheet is on file for this venue.",compared:"Venues that hold the spec sheet reorder more steadily than those that do not (sample data).",why:["Kitchens need allergen and storage details in writing before a new line goes on a menu.","The sheet is the only source for allergen statements. The rep does not improvise them.","A signed copy shows the venue received the current version."],talk:["Hand over the printed sheet and point to the allergen table.","If asked something the sheet does not cover, log it for the product team."],guardrail:"Allergen and nutrition statements come only from the current spec sheet. The agent never makes its own."},{id:"standing",type:"Set up a standing order",agent:"order",effort:10,evidence:"note",value:[200,1100],uses:"core",segments:["dining","canteens"],title:"Set up a standing order for {product}",saw:"{product} has been ordered in {weeks} of the last 8 weeks, in similar quantities each time.",compared:"This venue's own order history, which varies by less than a case a week.",why:["A standing order saves the buyer a call and the venue a stock-out.","The quantity comes from the last 8 weeks, not from a target.","It can be paused for closures and holidays."],talk:["Offer it as a convenience with an easy way to change it.","Agree the cut-off day for changes."]},{id:"cover",type:"Check stock room cover",agent:"order",effort:8,evidence:"photo",value:[120,600],uses:"core",title:"Check stock room cover before {event}",saw:"Counts from the last two visits show about {days} days of cover on {product}.",compared:"Expected demand in the weeks around {event}, {eventDays} days away.",why:["Busy weeks cause the most emergency orders.","A top-up is cheaper than an emergency delivery for both sides.","The photo records what was actually on the shelf."],talk:["Walk the store room with {person} and count together.","Order to the event, not to the month."]},{id:"trial",type:"Offer a tasting trial",agent:"gap",effort:15,evidence:"note",value:[100,500],uses:"new",segments:["dining","hotels"],title:"Offer a tasting trial of {product}",saw:"{product} launched {weeks} weeks ago and this kitchen has not tried it.",compared:"Trial-to-order rate for venues of this type in {area} and nearby (sample data).",why:["Chefs decide on taste and yield, not on a brochure.","A small trial case carries little risk for the venue.","Trial feedback goes straight back to the product team."],talk:["Ask {person} for the dish they would try it in first.","Leave a one-page feedback card with the sample.","Agree when to call back for the verdict."]},{id:"coldchain",type:"Check cold chain on delivery",agent:"gap",effort:10,evidence:"photo",value:[80,400],uses:"core",segments:["hotels","canteens"],title:"Check the cold chain on the chilled drop",saw:"The last two delivery checks for this venue have no temperature reading on the receiving log.",compared:"The receiving checklist agreed with this venue.",why:["A missing reading is the first thing an inspector asks about.","It protects the venue and the depot if a product is questioned.","The photo of the log is the record."],talk:["Show {person} where the reading goes on the receiving log.","If the venue has no probe, report it to the regional manager."]},{id:"seasonal",type:"Plan the seasonal stock-up",agent:"order",effort:12,evidence:"note",value:[250,1400],uses:"focus",segments:["hotels","canteens"],title:"Plan the stock-up for {event}",saw:"Banquet and cycle-menu bookings show higher covers in the weeks around {event}.",compared:"This venue's order volumes in the same weeks last year (sample data).",why:["Bookings are known weeks ahead, so stock can be planned, not rushed.","{product} is on the seasonal menu.","Early orders let the depot hold stock for this venue."],talk:["Go through the booking calendar with {person}.","Agree a plan with a review point, not a single big order."]},{id:"window",type:"Move the visit to a quiet window",agent:"planner",effort:3,evidence:"note",value:[30,120],uses:"none",title:"Move the next {visit} to the quiet window",saw:"{n} of the last four {visits} landed in the lunch rush.",compared:"The service hours this venue shared with the depot.",why:["Buyers give more attention between services.","A shorter {visit} in a quiet window beats a longer one in a rush.","It avoids a repeat {visit} to the same venue."],talk:["Ask {person} when the kitchen is calmest.","Confirm the new time by message the day before."]},{id:"invoice",type:"Log an open invoice query",agent:"gap",effort:6,evidence:"note",value:[20,140],uses:"none",title:"Log the open invoice query",saw:"The venue raised a query on its last statement and there is no reply on file.",compared:"The accounts team queue, where queries older than a week are flagged.",why:["Unanswered queries slow orders more than a price rise does.","The rep logs it. The accounts team resolves it.","The venue hears back sooner when the query has the invoice number."],talk:["Ask {person} for the invoice number and what looks wrong.","Tell them who will reply and by when."],guardrail:"The agent never changes an invoice, a credit note or a payment term. The accounts team does."}],orderReasons:{core:["Averages {avg} units a week. About {cover} days of cover left.","Ordered in most of the last {weeks} weeks.","Covers the shortfall found today."],focus:["Supports the plan for {event}.","Focus line this cycle. The kitchen has it on a dish."],new:["Trial quantity for {weeks} weeks.","Listed by similar venues nearby. Start with one case."]},orderRules:[{kind:"totalAbove",amount:2500,route:"manager",text:"{Orders} above {limit} need {manager} approval."},{kind:"info",text:"Prices come from the contract price list. The agent cannot change them."}],overrideReasons:[{label:"Buyer is away this week",route:"manager"},{label:"The kitchen already chose its supplier",route:"manager"},{label:"Not allowed under the supply contract",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Buyer said no",blocked:!1},{label:"Product out of stock at the depot",blocked:!0},{label:"Account on a credit hold",blocked:!0,route:"kam"},{label:"Kitchen too busy to talk",blocked:!1}],visitNotes:["Order taken, {n} lines.","Store room counted with the chef. Top-up agreed.","Buyer away. Order taken by phone.","Sample case left for the next menu meeting.","Spec sheet handed over and signed for."],kpis:[{id:"range",label:"Core range ordered",format:"pct",range:[55,95],target:85},{id:"fill",label:"Order fill rate",format:"pct",range:[82,99],target:96},{id:"lines",label:"Lines per order",format:"count",range:[4,16],target:12},{id:"menu",label:"Menu placements this quarter",format:"count",range:[0,5],target:3,segments:["dining","hotels"]},{id:"standing",label:"Standing orders in place",format:"pct",range:[20,80],target:60}],guardrails:[{id:"all1",agent:"all",text:"Follows the contract price list. Never suggests a price or terms outside it."},{id:"gap1",agent:"gap",text:"Allergen and nutrition statements come only from the current spec sheet."},{id:"order1",agent:"order",text:"Never suggests more stock than the venue can store and use before the date code."},{id:"planner1",agent:"planner",text:"Never drops a hotel or caterer on a supply contract without the regional manager."}],problems:[{title:"The biggest kitchens get the same call as the smallest",text:"Calls follow habit and the van route. Hotels and caterers with a large menu spend get a monthly call, while small cafes get a weekly one.",capability:"potential"},{title:"Short deliveries are found at the door",text:"The kitchen finds the gap when the driver leaves. By then the chef has bought the line from someone else.",capability:"gaps"},{title:"New lines wait for a menu that nobody planned for",text:"Menu changes are the one chance to get a new product tried. Reps usually hear about them after the menu is printed.",capability:"ranking"},{title:"Calls land in the lunch rush",text:"Fixed routes ignore service hours. The buyer is plating covers while the rep waits at the back door.",capability:"planning"},{title:"Orders are phoned in from memory",text:"Reps repeat last week's order. Seasonal peaks and new lines are not in it until the kitchen runs out.",capability:"order"},{title:"We cannot show what was agreed with the kitchen",text:"Spec sheets, sample trials and receiving checks are on paper or in the rep's head. A query months later has no record.",capability:"evidence"}],assistant:[{q:"Why is this venue first today?",a:"It has the most value across its actions and its order, and it is open for calls in the window before the next venue."},{q:"Which venues are due a menu conversation?",a:"The ones whose kitchens change menu within a few weeks and have a new product not yet trialed. The Gap agent ranks those first."},{q:"What should I say about a new product?",a:"Offer a sample case, give the cost per portion in writing, and agree when you will call back for the verdict."},{q:"Can I give an allergen answer from memory?",a:"No. Allergen and nutrition statements come only from the current spec sheet. Hand it over and log any question it does not cover."},{q:"How did the draft arrive at these quantities?",a:"From the venue's weekly average, the days of cover from the last count and the delivery cycle. You can change any line."},{q:"Where does an override go?",a:"It goes to your regional manager with your reason. An override is feedback for the agents, not a mark against you."},{q:"Which venues have I not seen for a month?",a:"Check the hotels and caterers with the longest gap. The Visit Planner puts them on the next routes."},{q:"Should I trust a low confidence item?",a:"Each item shows a confidence level. Low confidence means thin data, so check the store room before acting."}],storyline:["Pick Foodservice distribution and the prospect's country. Say it is sample data.","Today: the rep's venues, ranked by value, with local cities and currency.",'Open the first visit brief. Approve the menu action. Override the next with "Not allowed under the supply contract".',"Open an action: the reasons, the talking points and the spec sheet guardrail.","Order: change a line, then show the approval rule when the total passes the limit.","Complete the visit, then switch to the regional manager. The override is in the exception queue.","Agent controls: press stop on the Order agent and watch its lines pause in the brief.",'How this is configured: venues, products, actions and KPIs. "This is a configuration, not a custom build."'],forbidden:["patient","clinic","physician","dealer","farmer","loan","workshop"]};var ja={assistantContext:z({today:{rep:[{q:"Which {accounts} have a shutdown coming?",intent:"answer:todayShutdown"}]},brief:{rep:[{q:"What does the service agreement allow here?",intent:"answer:briefAgreement"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why not just ship the same box again?",intent:"answer:orderSame"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"What if the line is down when I arrive?",intent:"answer:routeLine"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Can an agent say a part is rated for a job?",intent:"answer:agentsRating"}],manager:[{q:"Can an agent say a part is rated for a job?",intent:"answer:agentsRating"}]}}),assistantAnswers:{talkToContact:"Go where the work is. Ask what failed or ran low this week, look at it together and agree one thing you can fix before you leave. Maintenance leads trust a rep who admits what they do not know and routes it to the technical desk.",goodVisit:"A good {visit} fits around the line, not through it. Count the crib, settle the urgent item first, record any datasheet question and leave an {order} that matches real use. End with a date for the next stock check.",guardrailWhy:"This assistant follows the contract price list, the maker datasheets and the rules your company set for the agents.",todayShutdown:"Look at {accounts} whose maintenance calendar shows a planned stop in the next weeks. The shutdown action in each brief shows the date, the job list and what the {account} bought last time. Plan stock early so it can be reserved.",briefAgreement:"The service agreement sets the contract prices, the delivery rules and the minimum levels for stocked items. The agent never suggests terms outside it. If the {contact} asks for more, log it and raise it with your {kam}.",orderSame:"Shipping the same box again keeps the {account} on urgent single-box buys. The draft starts from the minimum level, the days of use left and the delivery lead time, then adds focus items the {account} has a job for. You can change every line.",routeLine:"If the line is down, the team is busy and the {contact} will not have time. Use Mark closed today, then the route re-plans. Return at the next shift change and keep it short.",managerKam:"The ones with overrides that cite the service agreement, and plants with a blocked action. Those need a decision at account level, not a coaching note to the {rep}.",agentsRating:"No. Rating, load and pressure answers come from the technical desk and the maker datasheet. An agent can flag a mismatch between a job note and the datasheet, and a person decides what to do."},assistantRefusals:[{id:"ref-rating",guardrail:"gap1",patterns:["is it rated for","safe working load","max pressure","will it hold","torque limit","safe to use on"],refusal:"I cannot answer load, pressure or rating questions. The technical desk and the datasheet do.",allowed:"I can share the datasheet and flag the question for the technical desk."},{id:"ref-price",guardrail:"all1",patterns:["special price","extra discount","cut the price","off contract","price match","quote it at"],refusal:"I cannot set a price or a discount. The pricing desk sets prices from the contract list.",allowed:"I can log the quote request with the details the pricing desk needs."},{id:"ref-stock",guardrail:"order1",patterns:["buy extra stock","stock them up","overload the crib","push more boxes","year end loading"],refusal:"I do not suggest more than the site can store or use before the shelf life on the label.",allowed:"I can show how the quantity was set from the minimum level and the days of use left."},{id:"ref-plant",guardrail:"planner1",patterns:["drop this plant","remove the key plant","skip the strategic account","stop visiting"],refusal:"I do not drop a plant on a service agreement without your {manager}.",allowed:"I can show how the day re-plans if one stop closes."}]};var Ba={companion:{roles:{rep:"Sales engineer",manager:"Regional sales manager"},expenseCategories:[{id:"fuel",label:"Fuel",limitClass:"travel"},{id:"parking",label:"Parking and site access fees",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"ppe",label:"Safety gear bought locally",limitClass:"other"},{id:"lodging",label:"Hotel for an overnight trip",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"siteinduction",label:"Site safety induction for customer plants",cycleMonths:12},{id:"datasheet",label:"Reading datasheets and product ratings",cycleMonths:12},{id:"contract",label:"Contract price list and service agreement rules",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24},{id:"privacy",label:"Data privacy for field teams",cycleMonths:12}],learningModules:[{id:"m1",title:"Counting a crib in fifteen minutes",minutes:15,summary:"Work the shelves in a fixed order, record counts against the site minimum and agree the figures with the {contact}."},{id:"m2",title:"Setting up a restock bin",minutes:25,summary:"Choose steady-use items, set the minimum from real use and show the {contact} how a refill request reaches us."},{id:"m3",title:"Reading a datasheet on site",minutes:20,summary:"Find the rated limits, spot a job note that falls outside them and route the question to the technical desk."},{id:"m4",title:"Planning stock for a shutdown",minutes:25,summary:"Match the job list to items, reserve stock early and set dates to confirm the final list."},{id:"m5",title:"Replacing a discontinued item",minutes:15,summary:"Use the supersession list, show old and new side by side and flag changes in size or rating."},{id:"m6",title:"Working with the {kam}",minutes:20,summary:"When to escalate a service agreement question and what to log so nothing is lost."},{id:"m7",title:"Running a short toolbox talk",minutes:15,summary:"Use maker material, keep to ten minutes and collect the attendance sheet as the record."},{id:"m8",title:"Planning a day around shift changes",minutes:15,summary:"Group visits by shift pattern so each {contact} has time to talk."},{id:"m9",title:"Logging a quote request well",minutes:10,summary:"Capture quantity, date needed and the job so the pricing desk can answer in one pass."}],knowledge:[{id:"k1",title:"How do I set a minimum level for a bin?",text:"Take weekly use from the last 12 weeks, add the delivery lead time and a small buffer agreed with the {contact}. Write the level on the bin label and record it in the {account} notes."},{id:"k2",title:"What counts as proof of a toolbox talk?",text:"A signed attendance sheet with the date, the topic and the supervisor name. Keep a photo of the sheet. A talk without a sheet cannot support an audit question."},{id:"k3",title:"Where do I find the current datasheet?",text:"The item page holds the latest version with a revision date. Share that version with the {contact} and note the revision in your {visit} notes."},{id:"k4",title:"What do I say when the {contact} asks about the limits of a part?",text:"Do not answer from memory. Show the rated limits on the datasheet, then offer a call with the technical desk and log the question with the job details."},{id:"k5",title:"How do I read days of use?",text:"Days of use is stock on hand divided by average daily use. Under about five days on a core item means order now. The {order} draft shows it for each line."},{id:"k6",title:"Who approves a large {order}?",text:"Orders above the approval limit go to your {manager}. The limit shows on the {order} screen with the name of whoever it is waiting on."},{id:"k7",title:"What do I do about calibration dates?",text:"List the units with a due date in the next 30 days and hand it to the {contact}. Offer to book the lab collection. Never state that a tool is in or out of tolerance."},{id:"k8",title:"How should I log a refusal?",text:"When a {contact} declines, log the reason code, who said it and when. The agents learn from that, and nobody is scored on it."},{id:"k9",title:"What is the right way to claim mileage?",text:"Use the trip start and end from the route plan. Claims follow the company mileage rate and the distance unit used in your country."},{id:"k10",title:"How do I prepare for a plant {visit}?",text:"Open the {visit} brief, read the top three actions, bring the datasheets and the price list, and check the open items from the last {visit}."},{id:"k11",title:"What if the {contact} is unhappy?",text:"Listen first, note what they say, fix what you can on the day and tell your {manager} what you could not fix."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start there: it is the clearest gap in the crib."},{id:"p2",uses:["offer"],text:"{offer} could replace a part the team buys in a rush. Leave one unit for a real job and agree with {person} who will send feedback."},{id:"p3",uses:["trend","event"],text:"The last {order} was {trend}. {event} is {eventDays} days away, so settle the job list and the reserved stock now."}],valueStoryTemplates:[{id:"s1",title:"A crib that runs itself",uses:["share","orderCount"],text:"{name} has captured {share} of its estimated potential. Across the last {orderCount} {orders}, many were urgent single boxes. The next step is to agree minimum levels together and look again at the next {visit}."},{id:"s2",title:"A new item on a real job",uses:["offer","trend"],text:"The last {order} was {trend}. A trial of {offer} on one job gives {person} a way to test it without changing the contract range."},{id:"s3",title:"Ready for the stop",uses:["potential","share"],text:"Estimated potential at {name} is {potential} a year and the current figure is {current}. The gap of {whitespace} is an estimate from sample data. It is the reason to plan the next stop together."}],resourcePlans:[{id:"r1",name:"Shutdown season support",startWeek:1,weeks:4,perWeek:5},{id:"r2",name:"Crib count round",startWeek:3,weeks:2,perWeek:4}],guardrails:[{id:"ig1",text:"Rating, load and pressure statements come only from the maker datasheet and the technical desk. The Companion never writes its own.",blocked:["rated for","safe working load","will hold","guarantee","no risk","certified for"]},{id:"ig2",text:"Prices follow the contract list. Value stories use sample data and say so, and never claim a result.",blocked:["proven to","doubles output","will boost","risk free","special price","under the table"]}]}};var za={...ja,...Ba,id:"industrial",name:"Industrial supplies",tagline:"Plants, machine shops, contractors and facilities teams",icon:"config",accent:"#1E40AF",vocab:{account:"site",accounts:"sites",contact:"maintenance lead",contacts:"maintenance leads",rep:"sales engineer",reps:"sales engineers",manager:"regional sales manager",kam:"strategic accounts manager",offering
