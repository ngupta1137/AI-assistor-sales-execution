hy:["Stock-outs at the crib stop jobs and send the team to buy locally.","The count is cheap and the top-up is already drafted.","The photo shows the real level on the shelf at the time of the count."],talk:["Count with {person} and agree the figures before you order.","Keep the top-up to the agreed minimum, not above it."]},{id:"calibration",type:"Flag calibration due dates",agent:"gap",effort:8,evidence:"scan",value:[60,300],uses:"focus",segments:["plants","fab"],title:"Flag the calibration due dates on {product}",saw:"Scans of the tag on {n} units show a calibration date within the next 30 days.",compared:"The site calibration register shared at the last visit.",why:["Out-of-date tools fail audits and put measurements in doubt.","Calibration is done by an accredited lab. The rep flags the date.","Booking early avoids a gap with no tool on the floor."],talk:["Hand {person} the list of units with the due date.","Offer to book the collection with the lab."],guardrail:"The agent flags due dates only. It never states that a tool is in or out of tolerance."},{id:"shift",type:"Move the visit to a shift change",agent:"planner",effort:3,evidence:"note",value:[30,120],uses:"none",title:"Move the next {visit} to the shift change",saw:"{n} of the last four {visits} happened while the line was running at full pace.",compared:"The shift pattern this site shared with the depot.",why:["Maintenance leads can talk when the line is handed over.","It avoids standing by a machine for ten minutes.","It lines up with the day the crib is restocked."],talk:["Ask {person} when the quietest hour is.","Confirm the time the day before."]},{id:"quote",type:"Log a quote request",agent:"gap",effort:6,evidence:"note",value:[40,250],uses:"none",title:"Log the quote request",saw:"The site asked for a quote on a large or custom item and no request is on file.",compared:"The pricing desk queue, which handles all quotes.",why:["Quotes that wait lose the job to a quicker supplier.","The pricing desk sets the price. The rep passes on the request.","A complete request gets an answer in one pass."],talk:["Ask {person} for the quantity, the date needed and the job.","Tell them when to expect an answer."],guardrail:"The agent never quotes a price or a discount. The pricing desk does."}],orderReasons:{core:["Used about {avg} a week. {cover} days left in the crib.","Bought in most of the last {weeks} weeks.","Covers the count shortfall from today."],focus:["Supports the plan around {event}.","Focus item this cycle. The site has a job for it."],new:["Trial quantity for {weeks} weeks.","Similar sites nearby have it in use. Start with one unit."]},orderRules:[{kind:"totalAbove",amount:4e3,route:"manager",text:"{Orders} above {limit} need {manager} approval."},{kind:"info",text:"Prices come from the contract price list and the pricing desk. The agent cannot change them."}],overrideReasons:[{label:"Maintenance lead not on site",route:"manager"},{label:"The site already holds a rival contract",route:"manager"},{label:"Not allowed under the service agreement",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Maintenance lead said no",blocked:!1},{label:"Item on backorder at the depot",blocked:!0},{label:"Site on a credit hold",blocked:!0,route:"kam"},{label:"Line was down, no time to talk",blocked:!1}],visitNotes:["Order taken, {n} lines.","Crib counted with the team. Minimum levels agreed.","Maintenance lead on a call-out. Order taken by phone.","Datasheet shared and the job use confirmed.","Trial unit left for the next job."],kpis:[{id:"range",label:"Contract items bought",format:"pct",range:[45,92],target:80},{id:"otif",label:"On time and in full",format:"pct",range:[84,99],target:95},{id:"stockouts",label:"Crib stock-outs (last 30 days)",format:"count",range:[0,8],target:1,lowerIsBetter:!0},{id:"bins",label:"Restock bins in place",format:"pct",range:[10,85],target:65,segments:["plants","fab"]},{id:"quotes",label:"Quotes answered within a day",format:"pct",range:[50,98],target:90}],guardrails:[{id:"all1",agent:"all",text:"Follows the contract price list and the maker datasheet for each item."},{id:"gap1",agent:"gap",text:"Load, pressure and rating questions go to the technical desk. The agent never answers them."},{id:"order1",agent:"order",text:"Never suggests more than the site can store or use before the shelf life on the label."},{id:"planner1",agent:"planner",text:"Never drops a plant on a service agreement without the regional sales manager."}],problems:[{title:"Big plants and small shops get the same visit rhythm",text:"Visits follow the van route. A plant with a shutdown coming gets a call every month, while a small shop is seen every week.",capability:"potential"},{title:"We find out about a stoppage after it happens",text:"The crib runs out of a bearing or a filter and the team buys it locally. We hear about it a week later, if at all.",capability:"gaps"},{title:"Reps chase the loudest customer",text:"A long list of open items, none ranked. The planned shutdown is lost behind this week's urgent request.",capability:"ranking"},{title:"Visits miss shift changes and shutdown dates",text:"Fixed call cycles ignore the maintenance calendar. The best order of the year is placed with someone else.",capability:"planning"},{title:"Orders are one box at a time",text:"Without counts and minimums, orders are urgent single boxes. Delivery costs rise and the site pays for the rush.",capability:"order"},{title:"We cannot show what a site was told",text:"Datasheet questions, toolbox talks and calibration dates live in emails and notebooks. A question after an incident has no record.",capability:"evidence"}],assistant:[{q:"Why is this site first today?",a:"It has the most value at stake across its actions and its order, and its shift change fits before the next site."},{q:"Which sites have a shutdown coming?",a:"The plants whose maintenance calendar shows a planned stop in the next few weeks. The Order agent drafts a stock plan for each one."},{q:"What do I say about a new item?",a:"Describe the problem it solves before the item itself, leave one unit for a real job and agree who will send feedback."},{q:"Can I say a part is rated for a job?",a:"No. Rating, load and pressure questions go to the technical desk. Share the datasheet and offer a call with them."},{q:"How was the top-up quantity set?",a:"From the site minimum, the days of use left at the last count and the delivery lead time. You can change any line."},{q:"What happens to an override?",a:"It goes to your regional sales manager with the reason you picked. It is feedback for the agents and no penalty for you."},{q:"Which sites have I not seen in a month?",a:"Check the plants with the longest gap since the last visit. The Visit Planner adds them to the next routes."},{q:"When should I doubt an item?",a:"When it shows low confidence. That means thin data, so count the crib yourself before acting."}],storyline:["Pick Industrial supplies and the prospect's country. Say it is sample data.","Today: the engineer's sites, ranked by value, with local cities and currency.",'Open the first visit brief. Approve the restock bin. Override the toolbox talk with "Not allowed under the service agreement".',"Open an action: the reasons, the talking points and the rating guardrail.","Order: change a quantity, then show the approval rule when the total passes the limit.","Complete the visit, then switch to the regional sales manager. The override is in the exception queue.","Agent controls: stop the Order agent and watch its crib counts pause in the brief.",'How this is configured: sites, items, actions and KPIs. "This is a configuration, not a custom build."'],forbidden:["patient","clinic","physician","farmer","loan","chef","shopper"]};var Va={assistantContext:z({today:{rep:[{q:"Which {accounts} have the buying window closing?",intent:"answer:todayWindow"}]},brief:{rep:[{q:"What does the trade agreement allow here?",intent:"answer:briefTrade"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why not copy last season's {order}?",intent:"answer:orderLast"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"What if the {contact} has to cancel?",intent:"answer:routeCancel"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Can an agent tell a {contact} what to charge?",intent:"answer:agentsResale"}],manager:[{q:"Can an agent tell a {contact} what to charge?",intent:"answer:agentsResale"}]}}),assistantAnswers:{talkToContact:"Start with what sold, not with the new range. Ask the {contact} which styles moved and which did not, listen, then show the one new style that answers a gap. A buyer who feels heard decides faster.",goodVisit:"A good {visit} is built on the sell-through numbers. Walk the floor, repair what is broken first, show one new idea, and leave with a clear next step: a reorder, a sample or a date for the pre-season order.",guardrailWhy:"This assistant follows the trade agreement, the season price list and the rules your company set for the agents.",todayWindow:"Look at {accounts} whose buying window closes within a few weeks and that have not placed a pre-season {order}. The pre-season action in each brief shows the days left and last season's result. Start with the largest.",briefTrade:"The trade agreement sets the wholesale prices, exchange windows and the order budget. The agent never suggests terms outside it. If the {contact} asks for more, log it and raise it with your {kam}.",orderLast:"Copying last season's {order} repeats last season's misses. The draft starts from sell-through and the size curve of what actually sold, then adds focus and new styles that the {account} has floor space for. You can change every line.",routeCancel:"If the {contact} cancels, use Mark closed today and the route re-plans. Offer another weekday away from the trading peak, and send a confirmation the day before.",managerKam:"The ones with overrides that cite the trade agreement, and department stores with a blocked action. Those need a decision at account level, not a coaching note to the {rep}.",agentsResale:"No. The {account} sets its own resale prices. An agent can show the wholesale price list and sell-through, and a person agrees the order."},assistantRefusals:[{id:"ref-resale",guardrail:"gap1",patterns:["retail price","resale price","sell it at","price it at","mark it down to","markdown to"],refusal:"I cannot recommend a resale price or a markdown. The retailer sets its own.",allowed:"I can show the wholesale price list and how the style sold through."},{id:"ref-terms",guardrail:"all1",patterns:["extra discount","free goods","better terms","longer payment","side deal","secret rebate"],refusal:"I cannot suggest terms outside the trade agreement and the season price list.",allowed:"I can show what the trade agreement allows and who to ask for an exception."},{id:"ref-budget",guardrail:"order1",patterns:["go over the budget","push more styles","load the retailer","overbook the order","fill the stockroom","end of season dump"],refusal:"I do not suggest an order above the retailer's agreed order budget.",allowed:"I can show how the quantities were built from sell-through and weeks of cover."},{id:"ref-dept",guardrail:"planner1",patterns:["drop this department store","remove the key retailer","skip the department store","stop visiting"],refusal:"I do not drop a department store on a trade agreement without your {manager}.",allowed:"I can show how the schedule changes if one appointment is moved."}]};var Ka={companion:{roles:{rep:"Wholesale rep",manager:"Area manager"},expenseCategories:[{id:"fuel",label:"Fuel",limitClass:"travel"},{id:"parking",label:"Parking and sample van fees",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"props",label:"Display props bought locally",limitClass:"other"},{id:"lodging",label:"Hotel for a trade show trip",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"trade",label:"Trade agreement and price list rules",cycleMonths:12},{id:"range",label:"Season range and size curve training",cycleMonths:6},{id:"competition",label:"Fair dealing and resale price rules",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24},{id:"privacy",label:"Data privacy for field teams",cycleMonths:12}],learningModules:[{id:"m1",title:"Reading a size curve",minutes:15,summary:"Compare what sold with what remains, spot a broken run and propose only what is missing."},{id:"m2",title:"Selling a new range in person",minutes:25,summary:"Let the {contact} handle the sample first, then suggest a small first run in the core sizes."},{id:"m3",title:"Pre-season order meetings",minutes:25,summary:"Review last season, build around the agreed order budget and set the follow-up date."},{id:"m4",title:"Setting a floor display",minutes:20,summary:"Use the visual guide, ask where the story can go and respect the {account} layout."},{id:"m5",title:"Taking an in-season reorder",minutes:15,summary:"Open with sell-through, size to four weeks of sales and confirm the delivery date."},{id:"m6",title:"Working with the {kam}",minutes:20,summary:"When to escalate a trade agreement question and what to log so nothing is lost."},{id:"m7",title:"Handling returns conversations",minutes:15,summary:"Group return reasons, separate fit from quality and route each to the right team."},{id:"m8",title:"Planning around trading peaks",minutes:15,summary:"Book quiet weekdays for range reviews and keep peaks for service calls."},{id:"m9",title:"Online listing basics",minutes:20,summary:"What a good image pack and size chart contain, and how to check they are live."}],knowledge:[{id:"k1",title:"How do I prepare a sample bag?",text:"Pack the range in the order you will show it, include a size chart and a price sheet, and check each sample for damage. Record the set on the signed receipt before you leave it with a {contact}."},{id:"k2",title:"What counts as a valid floor photo?",text:"One wide photo of the whole display and one close photo of the styles. The date and the {account} visible. Photos that do not show the full display cannot support a layout agreement."},{id:"k3",title:"What is the exchange window?",text:"The trade agreement sets a period during which unsold styles may be exchanged. Check the dates on the agreement and note them in the {visit} record. Never promise a window the agreement does not give."},{id:"k4",title:"What if the {contact} asks what to charge?",text:"The {account} sets its own resale prices. Show the wholesale price list and how the style sold through elsewhere, and leave the decision with the {contact}."},{id:"k5",title:"How do I read weeks of cover?",text:"Weeks of cover is stock on hand divided by average weekly sales. Under about three weeks on a selling style means order now. The {order} draft shows it per line."},{id:"k6",title:"Who approves a large {order}?",text:"Orders above the approval limit go to your {manager}. The limit shows on the {order} screen with whoever it is waiting for."},{id:"k7",title:"What if the style sells out at the showroom?",text:"Offer the closest style from the plan, log the lost demand and tell the {contact} when the next delivery is due. Do not promise a date the depot has not confirmed."},{id:"k8",title:"How should I log a refusal?",text:"When a {contact} says no, note the reason code, the name and the date. The agents learn from refusals, and they are not used to score you."},{id:"k9",title:"What is the right way to claim mileage?",text:"Use the trip start and end from the route plan. Claims follow the company mileage rate and the distance unit set for your country."},{id:"k10",title:"How do I prepare for a department store appointment?",text:"Open the {visit} brief, read the top three actions, bring last season's sell-through and the price list, and check the open items from the last appointment."},{id:"k11",title:"What if the {contact} is unhappy?",text:"Hear the complaint out, write it down in their words, put right what you can in the room and pass the rest to your {manager} the same day."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start there: it is the clearest gap on the floor."},{id:"p2",uses:["offer"],text:"{offer} could fill a gap in the current range. Let {person} handle the sample and suggest a first run in the core sizes."},{id:"p3",uses:["trend","event"],text:"The last {order} was {trend}. {event} is {eventDays} days away, so settle the plan and the order budget now."}],valueStoryTemplates:[{id:"s1",title:"A range that sells through",uses:["share","orderCount"],text:"{name} has captured {share} of its estimated potential. Across the last {orderCount} {orders}, the core sizes sold best. The next step is to repair the sizes we found missing and look at sell-through again at the next {visit}."},{id:"s2",title:"A new style for the floor",uses:["offer","trend"],text:"The last {order} was {trend}. A first run of {offer} lets {person} test a new look in the core sizes without changing the rest of the range."},{id:"s3",title:"Ready for the season",uses:["potential","share"],text:"Estimated potential at {name} is {potential} a year and the current figure is {current}. The gap of {whitespace} is an estimate from sample data. It is the reason to plan the season together."}],resourcePlans:[{id:"r1",name:"Pre-season showroom days",startWeek:1,weeks:3,perWeek:6},{id:"r2",name:"In-season reorder calls",startWeek:3,weeks:3,perWeek:4}],guardrails:[{id:"ag1",text:"The retailer sets its own resale prices. The Companion never recommends a price or a markdown.",blocked:["sell it at","retail price of","mark it down","guarantee","price match","under the table"]},{id:"ag2",text:"Value stories use sample data and say so. They never claim a result for a season.",blocked:["proven to","doubles sales","will boost","risk free","will sell out","side deal"]}]}};var Ga={...Va,...Ka,id:"apparel",name:"Apparel and footwear",tagline:"Department stores, boutiques and online sellers",icon:"heart",accent:"#A21CAF",vocab:{account:"retailer",accounts:"retailers",contact:"buyer",contacts:"buyers",rep:"wholesale rep",reps:"wholesale reps",manager:"area manager",kam:"key account manager",offering:"style",offerings:"styles",order:"order",orders:"orders",visit:"visit",visits:"visits"},personas:{rep:"Wholesale rep",manager:"Area manager",admin:"Commercial operations lead"},segments:[{id:"dept",name:"Department stores",share:.2,key:!0,visitMinutes:[45,60],style:"Appointment with the buyer, built around the season plan, the floor layout and the order budget.",annualValue:[8e4,28e4],hours:[540,1020],orderQty:[6,22],types:[{type:"Department store",naming:"institution",words:{en:["Department Store","Emporium","Fashion House"],pt:["Magazine","Loja de Departamentos"],es:["Almacén","Grandes Almacenes"],de:["Kaufhaus","Modehaus"],id:["Toserba","Pusat Mode"],fr:["Grand Magasin","Maison de Mode","Galerie"]}}],roles:["Fashion buyer","Footwear buyer","Merchandise planner"]},{id:"boutique",name:"Independent boutiques",share:.5,visitMinutes:[20,35],style:"Relationship visit with the owner, often by appointment, with a sample bag and a size chart.",annualValue:[9e3,38e3],hours:[600,1080],orderQty:[2,8],types:[{type:"Boutique",naming:"family",words:{en:["Boutique","Style House","Wardrobe"],pt:["Butique","Moda"],es:["Boutique","Moda"],de:["Modeladen","Boutique"],id:["Butik","Rumah Mode"],fr:["Boutique","Maison de Style","Garde-Robe"]}},{type:"Shoe shop",naming:"family",words:{en:["Footwear","Shoe Room","Soles"],p ddle sizes while the end sizes remain.",compared:"The size curve of the {peers} best-selling retailers of this style in {city}.",why:["Middle sizes sell first, and a broken run loses the customer, not just the sale.","The depot has the missing sizes in stock today.","A repaired run lets the style keep its floor space."],talk:["Show {person} the stock file and the size curve side by side.","Propose only the missing sizes, not a full run.","Agree a delivery date before the next weekend."]},{id:"reorder",type:"Take an in-season reorder",agent:"order",effort:12,evidence:"note",value:[250,1500],uses:"core",title:"Take a reorder on {product} while it is selling",saw:"Sell-through of {product} is {pct}% in the first {weeks} weeks, ahead of the plan for this retailer.",compared:"The retailer's own season plan and the sell-through of similar retailers (sample data).",why:["Fast sellers run out before the season ends.","Reorder lead time is short only while fabric is held at the factory.","The quantity follows actual sales, not the original forecast."],talk:["Open with the sell-through figure and ask {person} how the floor feels.","Offer a reorder sized to four weeks of sales."]},{id:"preseason",type:"Take the pre-season order",agent:"order",effort:20,evidence:"note",value:[400,2400],uses:"focus",segments:["dept","boutique"],title:"Take the pre-season order before {event}",saw:"The retailer's order budget for the next season is open and {eventDays} days remain before {event}.",compared:"Last season's order and what sold through (sample data).",why:["Pre-season orders get the best delivery dates.","{product} is in the range plan for the coming season.","The agreed order budget is known, so the order can be sized to it."],talk:["Walk {person} through last season's winners and misses first.","Build the new order around the agreed budget, not above it.","Book a follow-up to confirm sizes."]},{id:"floor",type:"Reset the floor display",agent:"gap",effort:15,evidence:"photo",value:[100,650],uses:"focus",segments:["dept","boutique"],title:"Reset the floor display for {product}",saw:"The last floor photo shows {product} on a back wall with no mannequin or table space.",compared:"The visual guide for this season and photos from {peers} similar retailers.",why:["Styles on a front table sell faster than the same style on a back rail.","The visual guide is approved and the props are in the car.","The retailer keeps control of its layout. The rep only proposes."],talk:["Ask {person} which table or wall can carry the story.","Offer to set it yourself and take down last season's props."]},{id:"newstyle",type:"Show a new style",agent:"gap",effort:12,evidence:"note",value:[150,900],uses:"new",title:"Show {product} from the new range",saw:"{product} arrived {weeks} weeks ago and this retailer has not seen it in person.",compared:"{pct}% of similar retailers in {city} have ordered a first run of it.",why:["Buyers decide on touch and fit, not on photos.","First orders get the early delivery slots.","The sample set is in the car."],talk:["Let {person} handle the sample before you describe it.","Suggest a small first run in the core sizes."]},{id:"aged",type:"Review aged stock",agent:"gap",effort:10,evidence:"note",value:[80,480],uses:"core",title:"Review the aged stock of {product}",saw:"{qty} units of {product} have sat in the store for more than {weeks} weeks.",compared:"The retailer's own aging report and the trade agreement terms on returns and exchanges.",why:["Aged stock ties up the retailer's budget for the next season.","The trade agreement may allow an exchange within a set window.","Clearing space early keeps the floor fresh."],talk:["Ask {person} what they plan to do with the stock.","Explain the exchange window in the trade agreement and note the date."],guardrail:"The retailer sets its own resale prices. The agent never recommends a resale price or markdown."},{id:"images",type:"Send product images and size charts",agent:"gap",effort:8,evidence:"note",value:[60,340],uses:"focus",segments:["online"],title:"Send product images and size charts for {product}",saw:"The seller's listings for {product} use older images and no size chart.",compared:"Sellers with a current size chart and images, which show fewer fit-related returns (sample data).",why:["Fit questions are the main reason for returns online.","The image pack and chart are ready to send.","Better listings help the style sell without discounting."],talk:["Ask {person} how listings are updated and who does it.","Share the pack and confirm they received it."]},{id:"returns",type:"Review the returns pattern",agent:"gap",effort:10,evidence:"note",value:[60,380],uses:"none",segments:["online","boutique"],title:"Review the returns pattern with the {contact}",saw:"Return reasons on this retailer's last {n} returns point to fit and sizing, not quality.",compared:"The return reason codes shared in the monthly report.",why:["Fit problems can often be fixed with a chart or a size note.","Quality problems need a different team, so the reason matters.","The pattern is only visible when the codes are read together."],talk:["Go through the reasons with {person} one by one.","Log any quality issue for the product team."]},{id:"sample",type:"Leave a next-season sample set",agent:"gap",effort:15,evidence:"signature",value:[100,700],uses:"new",segments:["dept","boutique"],title:"Leave a sample set of {product} for next season",saw:"Next season's buying window opens in {weeks} weeks and this retailer holds no sample set.",compared:"Retailers that held samples before the window opened placed larger first orders (sample data).",why:["A buyer who can try on the sample orders with more confidence.","The signed receipt tracks where the sample set is.","Sample sets return to the showroom after the window."],talk:["Agree who in the team will handle the samples.","Set the date for pick-up in the signed receipt."]},{id:"trading",type:"Visit outside the trading peak",agent:"planner",effort:3,evidence:"note",value:[30,120],uses:"none",title:"Move the next {visit} away from the trading peak",saw:"{n} of the last four {visits} fell on a Saturday or a promotion day.",compared:"The retailer's trading calendar shared with the showroom.",why:["Buyers and owners are on the floor during peaks.","A quieter weekday gives time to look at the range properly.","It avoids a wasted trip."],talk:["Ask {person} which weekday works best.","Send a confirmation the day before."]}],orderReasons:{core:["Selling about {avg} units a week. {cover} weeks of cover left.","Sold through {qty} units in the last four weeks.","Repairs the sizes missing today."],focus:["Fits the range plan for {event}.","Focus style this season. The retailer has floor space."],new:["First run of {weeks} weeks for the new range.","Similar retailers nearby have ordered it. Start with the core sizes."]},orderRules:[{kind:"totalAbove",amount:6e3,route:"manager",text:"{Orders} above {limit} need {manager} approval."},{kind:"info",text:"Wholesale prices come from the season price list. The agent cannot change them or suggest resale prices."}],overrideReasons:[{label:"Buyer is away this week",route:"manager"},{label:"The retailer already bought the range elsewhere",route:"manager"},{label:"Not allowed under the trade agreement",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Buyer said no",blocked:!1},{label:"Style sold out at the showroom",blocked:!0},{label:"Retailer on a credit hold",blocked:!0,route:"kam"},{label:"Buyer in a meeting, no time",blocked:!1}],visitNotes:["Order taken, {n} lines.","Sample set shown. Buyer to decide next {visit}.","Buyer away. Order confirmed by phone.","Size run repaired and floor display reset.","Returns reasons reviewed with the team."],kpis:[{id:"sellthru",label:"Sell-through this season",format:"pct",range:[35,85],target:70},{id:"sizes",lab
