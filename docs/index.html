/* AI Assistor: mobile-first. On desktop the app sits in a centred phone frame. */
:root {

* { box-sizing: border-box; }

  .phone-inner { height: 100%; border-radius: 30px; }
  body.notes-open .side { display: block; width: 300px; max-height: min(860px, calc(100vh - 40px)); overflow: auto; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; font-size: 14px; }
}

/* ---- App shell ---- */
.app { display: flex; flex-direction: column; height: 100%; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }

/* ---- Building blocks ---- */

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; background: var(--surface); color: var(--ink); }

/* Account 360 */

.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

/* Presenter menu and notes */

.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field select, .field input { min-height: var(--tap); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--surface); }
.presenter-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.story { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.story a { color: var(--ink); text-decoration: none; }
.story a:hover { color: var(--accent); }
.side-switch { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.next { display: flex; flex-direction: column; gap: 4px; }

rson} where material is allowed in this store.","Take down expired material from the last cycle at the same time."]},{id:"facings",type:"Restore planogram facings",agent:"gap",effort:12,evidence:"photo",value:[100,500],uses:"core",segments:["super"],title:"Restore agreed facings for {product}",saw:"Shelf photo shows {product} on fewer facings than the planogram agreed with the retailer.",compared:"Planogram for this store cluster, last reset {weeks} weeks ago.",why:["Lost facings usually mean another supplier took the space.","Lines at full facings run out less often.","The retailer agreement gives the brand this space."],talk:["Show the planogram page, not an opinion.","If head office gave the space away, log it instead of moving product."]},{id:"pricetag",type:"Flag a price tag error",agent:"gap",effort:6,evidence:"photo",value:[40,200],uses:"core",title:"Flag the wrong shelf price on {product}",saw:"The shelf price for {product} in the last photo does not match the retailer price file.",compared:"Retailer price file sent this week.",why:["Wrong tags cause disputes at the till and cost trust.","Shoppers compare price at the shelf first.","The store sets prices. The rep only flags the mismatch."],talk:["Point out the mismatch to {person} and let the store correct it.","Photograph the corrected tag on your next pass through the aisle."],guardrail:"The store sets shelf prices. The agent flags a mismatch and never changes a price."},{id:"topup",type:"Top up fast movers",agent:"order",effort:10,evidence:"scan",value:[150,700],uses:"core",segments:["conv","indep"],title:"Top up fast movers before the weekend",saw:"Stock for {n} fast-moving lines covers about {days} days at the current rate of sale.",compared:"This store's own order history over the last 12 weeks.",why:["Friday to Sunday is the busiest part of the week in this store's data.","Delivery from the distributor takes two days.","The lines are already in the suggested order."],talk:["Walk the shelf with {person
