/* ---- Config and problems ---- */

/* ---- Route ---- */
.timeline { list-style: none; margin: 0; padding: 0; }

/* ---- Ask ---- */
.chips-q { display: flex; flex-direction: column; gap: var(--s2); }

.msg { display: flex; flex-direction: column; gap: var(--s1); max-width: 90%; }

/* ---- Setup ---- */
.setup { overflow-y: auto; height: 100%; display: flex; flex-direction: column; }

.setup-brand { display: flex; align-items: center; gap: var(--s2); font-weight: 700; }

.setup-head h1 { font-size: var(--text-xl); }
.setup-step { font-size: var(--text-md); font-weight: 600; margin-bottom: var(--s3); }
.choice-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.choice-list li + li { border-top: 1px solid var(--line-soft); }
.choice { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 52px; padding: 6px var(--s3); background: var(--surface); border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.choice .tile-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--surface-inset); color: var(--ink-2); flex: none; }

.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
.chip { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s3); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); text-align: left; }
.chip b { font-size: var(--text-sm); font-weight: 600; }

.personas { display: flex; flex-direction: column; gap: var(--s2); }
.persona { display: flex; flex-direction: column; align-items: flex-start; padding: var(--s3); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); min-height: var(--tap); }
.persona b { font-size: var(--text-md); font-weight: 600; }
.persona small { font-size: 13px; }
.persona.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 11px; }
.setup-foot { flex: none; padding: var(--s3) var(--s4) max(var(--s4), env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
.signin { font-size: var(--text-sm); line-height: 20px; color: var(--ink-2); }
.color-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; font-size: var(--text-sm); font-weight: 500; color: var(--ink-2); }
.color-row input[type="color"] { width: 48px; height: 44px; border: 1px solid var(--control-line); border-radius: var(--radius-sm); padding: 2px; background: var(--surface); }
.setup details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0 var(--s4); }
.setup details[open] { padding-bottom: var(--s4); }
.setup details .field + * { margin-top: var(--s3); }

/* ---- Presenter ---- */
.presenter-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 40; animation: fade var(--motion-base); }
.presenter { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); }
.presenter-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s2) var(--s2) var(--s2) var(--s4); border-bottom: 1px solid var(--line); }
.presenter-head > div { display: flex; align-items: center; gap: var(--s2); }
.presenter-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }

.side-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.story { list-style: none; padding: 0; margin: var(--s3) 0 0; display: flex; flex-direction: column; gap: var(--s1); counter-reset: step; }

.story a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s2); padding: var(--s2); border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; font-size: var(--text-sm); line-height: 20px; min-height: var(--tap); }

/* ---- Assistant ---- */
.as-launcher { position: absolute; right: var(--s4); bottom: var(--as-bottom, 84px); z-index: 20; display: inline-flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s4); border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; font-size: var(--text-sm); box-shadow: var(--shadow-2); cursor: pointer; }

/* ---- Compact layout (less scrolling) ---- */
.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0 14px; }

.hub-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); padding: 0 var(--s3) var(--s3); }

.hub-tile .hub-top { display: flex; align-items: center; gap: var(--s2); }

@media (hover: hover) and (pointer: fine) { .hub-tile:hover { background: var(--surface-inset); } }

pitch. Walk the aisle with the {contact}, point at the gap you can both see, and agree one fix before you leave. Keep it short: they are working the floor.",goodVisit:"A good {visit} is short and ends with something changed on the shelf. Check the empty days first, fix the top gap, confirm the display or listing you agreed, take the photo, and leave a {order} that matches what the shelf sells.",guardrailWhy:"This assistant follows each retailer agreement and the rules your company set for the agents.",todayShelf:"Look for {accounts} with empty days on core lines and little back stock. The out-of-stock action in each brief shows the days missed and how similar {accounts} in the same area compare. Fix the ordering gap, not only the shelf.",briefAgreement:"The retailer agreement sets what a supplier may do: how many displays, where material may go, what shelf space is agreed. The agent never suggests terms outside it. If the {contact} asks for more, log it and raise it with your {kam}.",orderRepeat:"Copying the last {order} keeps the range flat and misses new lines. The draft starts from sell-through and days of cover, then adds the focus and new lines the {account} has space for. You can change every line.",routeDelivery:"If the delivery is late, move that {visit} to the day after it lands, so the shelf can be filled and checked in one trip. Use Mark closed today for now and the route re-plans.",managerKam:"The ones with overrides that cite the retailer agreement, and key {accounts} with a blocked action. Those need a decision at account level, not a coaching note to the {rep}.",agentsPrice:"No. The store sets its own shelf prices. An agent can flag a tag that does not match the retailer price file, and the store corrects it."},assistantRefusals:[{id:"ref-price",guardrail:"gap1",patterns:["change the price","set the price","lower the price","raise the price","reprice","price tag to","shelf price to"],refusal:"I cannot set or change a shelf price. The store sets its own prices.",allowed:"I can flag a price that does not match the retailer price file."},{id:"ref-terms",guardrail:"all1",patterns:["discount","extra margin","free goods","free stock","side deal","pay for the display","pay the store","kickback","bonus to the store"],refusal:"I cannot suggest terms outside the retailer agreement.",allowed:"I can show what the agreement allows for a display or a promotion."},{id:"ref-load",guardrail:"order1",patterns:["load the store","load up the store","stuff the store","overstock","fill the back room","push extra stock","month end loading"],refusal:"I do not plan stock beyond about two weeks of expected sales.",allowed:"I can show how the quantity was worked out and what the shelf actually sells."},{id:"ref-key",guardrail:"planner1",patterns:["drop this store","remove the key account","skip the key account","stop visiting"],refusal:"I do not drop a key account from the plan without your {manager}.",allowed:"I can show what the route looks like if a stop closes today."}]};var la={companion:{roles:{rep:"Sales rep",manager:"Area sales manager"},expenseCategories:[{id:"fuel",label:"Fuel",limitClass:"travel"},{id:"parking",label:"Parking and tolls",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"display",label:"Display materials bought locally",limitClass:"other"},{id:"lodging",label:"Hotel for an overnight trip",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"agreement",label:"Retailer agreement and display standards",cycleMonths:12},{id:"foodsafety",label:"Food safety and handling basics",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24},{id:"privacy",label:"Data privacy for field teams",cycleMonths:12},{id:"launch",label:"Product range and launch training",cycleMonths:6}],learningModules:[{id:"m1",title:"Reading the shelf in five minutes",minutes:15,summary:"Check facings, price tags, dates and gaps in a fixed order, so no aisle is skipped."},{id:"m2",title:"Fixing an out-of-stock at the root",minutes:20,summary:"Tell a shelf gap from an ordering gap, and agree a minimum quantity with the {contact}."},{id:"m3",title:"Building a display that gets approved",minutes:25,summary:"What the retailer agreement allows, where material may go, and how to ask for space."},{id:"m4",title:"Listing a new product",minutes:20,summary:"Prepare the case for one facing, a trial quantity and a review date."},{id:"m5",title:"Taking an {order} that matches the shelf",minutes:15,summary:"Use days of cover and sell-through, not last week's {order}."},{id:"m6",title:"Working with the {kam}",minutes:20,summary:"When to escalate, what to log, and how to keep the {contact} informed."},{id:"m7",title:"Photos that prove a display",minutes:10,summary:"Angles, lighting and what the audit needs to see."},{id:"m8",title:"Planning a day around delivery days",minutes:15,summary:"Visit after delivery so a gap can be fixed in one trip."},{id:"m9",title:"Holiday season readiness",minutes:25,summary:"Space booking, stock cover and display timing before the holiday peak."}],knowledge:[{id:"k1",title:"How do I request extra display space?",text:"Ask the {contact} for a specific spot and a date range, and show the display plan. Follow the retailer agreement. If the answer is no, log it and raise it with your {kam}."},{id:"k2",title:"What counts as a valid shelf photo?",text:"One wide photo of the whole bay and one close photo of the gap. Date and store visible. No people in the frame. Photos that do not show the bay cannot support a display audit."},{id:"k3",title:"How do I flag a wrong shelf price?",text:"Compare the tag with the retailer price file, photograph the mismatch and tell the {contact}. The {account} corrects the tag. Never change a price tag yourself."},{id:"k4",title:"What if a delivery has not arrived?",text:"Check with the distributor, then move the {visit} to the day after delivery. Use Mark closed today on the route and the plan re-plans."},{id:"k5",title:"How do I read days of cover?",text:"Days of cover is stock on hand divided by average daily sales. Under about five days on a fast line means order now. The {order} draft shows it for each line."},{id:"k6",title:"Who approves a large {order}?",text:"Orders above the approval limit go to your {manager}. The limit is shown on the {order} screen, and the {order} says who it is waiting for."},{id:"k7",title:"How do I handle near-date product?",text:"Agree with the {contact} which units go to the markdown area, scan the batch codes so the return is logged, and rotate the rest to the front."},{id:"k8",title:"How should I log a refusal?",text:"Record the reason code, the name of the {contact} and the date. A refusal is useful data. It is not a mark against you."},{id:"k9",title:"What is the right way to claim mileage?",text:"Log the start and end of each trip from the route plan. Claims follow the company mileage rate and the distance unit for your country."},{id:"k10",title:"How do I prepare for a key {account} {visit}?",text:"Open the {visit} brief, read the top three actions, bring the display plan and the price file, and check the open items from the last {visit}."},{id:"k11",title:"What do I do if a {contact} is unhappy?",text:"Listen first, write down what they say, fix what you can in the {visit} and tell your {manager} what you could not fix."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start there: it is the clearest gap on the shelf."},{id:"p2",uses:["offer"],text:"There is room to list {offer} with one facing. Suggest a trial quantity and agree a review date with {person}."},{id:"p3",uses:["trend","event"],text:"The last {order} was {trend}. {event} is {eventDays} days away, so agree stock and space for it now."}],valueStoryTemplates:[{id:"s1",title:"Shelf and sell-through",uses:["share","orderCount"],text:"{name} has captured {share} of its estimated potential. Across the last {orderCount} {orders}, the shelf has kept the same core lines. The next step is to close the gaps we found together, one at a time, and look again at the next {visit}."},{id:"s2",title:"A range that grows with the shelf",uses:["offer","trend"],text:"The last {order} was {trend}. Adding {offer} in a small trial gives {person} a new line to test without giving up space, and the next {order} will show how it sells."},{id:"s3",title:"Space for the season",uses:["potential","share"],text:"Estimated potential at {name} is {potential} a year and the current figure is {current}. The gap of {whitespace} is an estimate from sample data. It is the reason to plan the season display together."}],resourcePlans:[{id:"r1",name:"Holiday display launch",startWeek:1,weeks:3,perWeek:5},{id:"r2",name:"New product listing push",startWeek:3,weeks:3,perWeek:4}],guardrails:[{id:"cg1",text:"Display terms and prices follow each retailer agreement. The Companion never promises a price, a margin or a sales result.",blocked:["guarantee","free goods","extra margin","price match","will increase","side deal","under the table"]},{id:"cg2",text:"Value stories use sample data and say so. They never claim a performance result.",blocked:["proven to","always sells","doubles sales","will boost","risk free"]}]}};var da={...ia,...la,id:"cpg",name:"Consumer goods",tagline:"Supermarkets, convenience stores and independent shops",icon:"cart",accent:"#0F766E",vocab:{account:"store",accounts:"stores",contact:"store manager",contacts:"store managers",rep:"sales rep",reps:"sales reps",manager:"area sales manager",kam:"key account manager",offering:"product",offerings:"products",order:"order",orders:"orders",visit:"visit",visits:"visits"},personas:{rep:"Sales rep",manager:"Area sales manager",admin:"Sales operations lead"},segments:[{id:"super",name:"Supermarkets",share:.28,key:!0,visitMinutes:[35,50],style:"Planned visit led by the retailer agreement: displays, facings and d:"choc",name:"Velmora Dark Chocolate 90 g",category:"Confectionery",price:26.4,unit:"case",status:"focus"},{id:"paste",name:"Mintora Toothpaste 150 g",category:"Oral care",price:24,unit:"case",status:"focus"},{id:"bars",name:"Morningfield Granola Bars 6 pack",category:"Breakfast",price:20.4,unit:"case",status:"focus"},{id:"crisps",name:"Crunchwell Lentil Crisps 80 g",category:"Snacks",price:16.8,unit:"case",status:"new"},{id:"lemon",name:"Brightleaf Sparkling Lemon 330 ml",category:"Beverages",price:12.6,unit:"case",status:"new"}],actions:[{id:"oos",type:"Fix out-of-stock",agent:"gap",effort:10,evidence:"photo",value:[120,600],uses:"core",title:"Fix the out-of-stock on {product}",saw:"Shelf photos and retailer scan data show {product} missing on {days} of the last 14 days.",compared:"{peers} similar stores in {area} kept it on shelf on 13 or more of those days.",why:["Each empty day sends shoppers to the next brand on the shelf.","{product} is one of the five fastest lines in this store.","Back-room count at the last visit was zero, so the gap is in ordering, not shelf filling.","Estimated sales recovered this month: {amount}."],talk:["Show {person} the empty-day count and agree a minimum shelf quantity.","Fill the shelf from back stock today if any has arrived.","Link the fix to the suggested order so it does not come back."]},{id:"display",type:"Secure a display",agent:"gap",effort:15,evidence:"photo",value:[300,1500],uses:"focus",segments:["super","conv"],title:"Secure an aisle-end display for {product}",saw:"No secondary display for {product} in the last {weeks} weeks of visit photos.",compared:"Stores in this group with a display sold {pct}% more of the line in display weeks (sample data).",why:["{event} is {eventDays} days away and display space gets booked early.","The retailer agreement allows one supplier display per aisle end.","The display kit and price cards are already in the car.","Estimated value over the display period: {amount}."],talk:["Ask for the aisle end near the entrance for two weeks.","Offer to build the display yourself during this visit.","Check the promo price is already loaded in the store system."],guardrail:"Display terms follow the retailer agreement. The agent never offers extra money or free goods."},{id:"listnew",type:"List a new product",agent:"gap",effort:12,evidence:"note",value:[200,900],uses:"new",title:"Get {product} listed",saw:"{product} launched {weeks} weeks ago and is not in this store's range.",compared:"{pct}% of similar stores in {city} have listed it, most within six weeks.",why:["Launch support (price card and shelf strip) is available this month only.","Shoppers here buy the parent brand heavily.","Listing needs one facing. No current line has to go."],talk:["Share the sell-through from nearby stores as sample figures, not a promise.","Propose a trial of one case.","Agree where the facing goes before you order."]},{id:"promo",type:"Place promo material",agent:"gap",effort:8,evidence:"photo",value:[60,300],uses:"focus",title:"Put up promo material for {product}",saw:"The current promotion on {product} has no shelf strip or price card in the last photo.",compared:"Promotion weeks with material in place, across {peers} similar stores.",why:["The promotional price is live but shoppers cannot see it.","The material is approved by the retailer for this cycle.","It takes under ten minutes."],talk:["Ask {person} where material is allowed in this store.","Take down expired material from the last cycle at the same time."]},{id:"facings",type:"Restore planogram facings",agent:"gap",effort:12,evidence:"photo",value:[100,500],uses:"core",segments:["super"],title:"Restore agreed facings for {product}",saw:"Shelf photo shows {product} on fewer facings than the planogram agreed with the retailer.",compared:"Planogram for this store cluster, last reset {weeks} weeks ago.",why:["Lost facings usually mean another supplier took the space.","Lines at full facings run out less often.","The retailer agreement gives the brand this space."],talk:["Show the planogram page, not an opinion.","If head office gave the space away, log it instead of moving product."]},{id:"pricetag",type:"Flag a price tag error",agent:"gap",effort:6,evidence:"photo",value:[40,200],uses:"core",title:"Flag the wrong shelf price on {product}",saw:"The shelf price for {product} in the last photo does not match the retailer price file.",compared:"Retailer price file sent this week.",why:["Wrong tags cause disputes at the till and cost trust.","Shoppers compare price at the shelf first.","The store sets prices. The rep only flags the mismatch."],talk:["Point out the mismatch to {person} and let the store correct it.","Photograph the corrected tag on your next pass through the aisle."],guardrail:"The store sets shelf prices. The agent flags a mismatch and never changes a price."},{id:"topup",type:"Top up fast movers",agent:"order",effort:10,evidence:"scan",value:[150,700],uses:"core",segments:["conv","indep"],title:"Top up fast movers before the weekend",saw:"Stock for {n} fast-moving lines covers about {days} days at the current rate of sale.",compared:"This store's own order history over the last 12 weeks.",why:["Friday to Sunday is the busiest part of the week in this store's data.","Delivery from the distributor takes two days.","The lines are already in the suggested order."],talk:["Walk the shelf with {person} and confirm counts before ordering.","Keep it to two weeks of sales. No loading."]},{id:"winback",type:"Win back a lapsed line",agent:"gap",effort:10,evidence:"note",value:[100,450],uses:"core",segments:["conv","indep"],title:"Win back {product}",saw:"{product} has not been ordered for {weeks} weeks after steady orders before that.",compared:"This store's own order pattern over the last six months.",why:["A lapsed line often means a delivery or credit problem, not lower demand.","Shoppers in {area} still buy it in nearby stores.","Estimated value over the next quarter: {amount}."],talk:["Ask {person} what changed before you suggest a quantity.","If it was a delivery problem, log it for the distributor."]},{id:"rotate",type:"Rotate near-date product",agent:"gap",effort:8,evidence:"scan",value:[50,250],uses:"core",segments:["super","conv"],title:"Rotate stock and pull near-date {product}",saw:"The last scan found {qty} units of {product} within 30 days of the best-before date.",compared:"Rotation standard in the retailer agreement.",why:["Near-date product ends up as a markdown or a write-off.","Rotating now protects the line's shelf space.","Returns under the agreement need a scan record."],talk:["Agree with {person} which units go to the markdown area.","Scan the batch codes so the return is logged."]},{id:"deliveryday",type:"Align visit with delivery day",agent:"planner",effort:3,evidence:"note",value:[30,120],uses:"none",title:"Move the next {visit} to the day after delivery",saw:"{n} of the last four {visits} happened before the delivery arrived.",compared:"Distributor delivery calendar for {area}.",why:["After delivery, the shelf can be filled and checked in one trip.","It saves a wasted {visit} each cycle.","Out-of-stocks found the day after delivery are ordering gaps, not shelf gaps."],talk:["Confirm the new day with {person}.","Ask whether the delivery day changes over the holiday season."]}],orderReasons:{core:["Averages {avg} cases a week. About {cover} days of cover left.","Sold {qty} cases in the last four weeks.","Covers the gap found today."],focus:["Supports the {event} display.","Focus line this cycle. Store has space on the aisle end."],new:["Launch line. Trial quantity for {weeks} weeks.","Listed in similar stores nearby. Start small."]},orderRules:[{kind:"totalAbove",amount:1500,route:"manager",text:"{Orders} above {limit} need {manager} approval."},{kind:"info",text:"Prices and promotions come from the retailer agreement. The agent cannot change them."}],overrideReasons:[{label:"Store manager not available today",route:"manager"},{label:"Already fixed by the merchandising team",route:"manager"},{label:"Not allowed under the retailer agreement",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Store manager said no",blocked:!1},{label:"No stock at the distributor",blocked:!0},{label:"Store on credit hold",blocked:!0,route:"kam"},{label:"Ran out of time",blocked:!1}],visitNotes:["Order taken, {n} lines.","Display checked. Price cards replaced.","Store manager away. Order taken by phone.","Out-of-stock fixed from back stock.","New line discussed. Decision next {visit}."],kpis:[{id:"dist",label:"Distribution of core range",format:"pct",range:[58,94],target:90},{id:"lines",label:"Lines per order",format:"count",range:[3,9],target:8},{id:"oos",label:"Out-of-stock days (last 14)",format:"count",range:[0,6],target:1,lowerIsBetter:!0},{id:"display",label:"Display compliance",format:"pct",range:[40,92],target:80,segments:["super","conv"]},{id:"strike",label:"Visits with an order",format:"pct",range:[55,92],target:85}],guardrails:[{id:"all1",agent:"all",text:"Follows each retailer agreement. Never offers terms outside it."},{id:"gap1",agent:"gap",text:"Never changes a shelf price. Only flags a mismatch."},{id:"order1",agent:"order",text:"Never loads a store beyond about two weeks of expected sales."},{id:"planner1",agent:"planner",text:"Never drops a key account store without the area sales manager."}],problems:[{title:"Our biggest stores get the same visit as the smallest",text:"Visit frequency follows habit and route convenience. High-potential stores are under-served while small ones get a weekly call.",capability:"potential"},{title:"Out-of-stocks are found late, or never",text:"Reps see the shelf every two weeks. By then the shopper has bought something else for ten days.",capability:"gaps"},{title:"Reps do the easy tasks first",text:'A 30-point checklist with nothing ranked. The display that matters most is left for "next time".',capability:"ranking"},{title:"Call cycles ignore delivery days and promotions",text:"Fixed routes mean visits land before the delivery or after the promotion has started.",capability:"planning"},{title:"Orders repeat last week's order",text:"New lines never get listed and range per store stays flat, because the rep copies the last order.",capability:"order"},{title:"We cannot prove what happened in store",text:"Execution is self-reported. Head office cannot link a display or a listing to what sold.",capability:"evidence"}],assistant:[{q:"Why is this store first today?",a:"It has the largest value at stake today across its gaps and its order, and it opens early enough to fit before the next store."},{q:"Which stores have the most out-of-stocks?",a:"The supermarkets on today's plan show the most empty days on core lines. The Gap agent ranks those fixes first."},{q:"What should I say about the new line?",a:"Share nearby sell-through as sample figures, propose one case as a trial, and agree the facing before ordering."},{q:"Can I offer an extra discount for a display?",a:"No. Display terms follow the retailer agreement. Raise it with your key account manager if the store asks."},{q:"How was the order quantity worked out?",a:"From the store's average weekly sales, the days of cover left and the delivery lead time. You can change any line."},{q:"What happens when I override an action?",a:"It goes to your area sales manager with your reason. Overrides are feedback for the agents, not a mark against you."},{q:"Which stores have I not seen in a month?",a:"Check the tier A stores with the longest gap since the last visit. The Visit Planner adds them to the next route."},{q:"How sure is the agent about this gap?",a:"Each item shows a confidence level. Low confidence means the data is thin. Check the shelf before acting."}],storyline:["Pick Consumer goods and the prospect's country. Mention it is sample data.","T ute re-plans the rest.",managerKam:"The ones with a contract under negotiation, a purchase order on hold or an open complaint on a key {account}. Those need a conversation at {account} level, not a coaching note.",agentsSize:"No. Sizing and technique are the surgeon's decision. An agent can confirm which sizes are on site and which instrument set the case needs. Anything clinical stays with the surgeon."},assistantRefusals:[{id:"ref-clinical",guardrail:"planner1",patterns:["which size","what size","implant size","which implant should","best technique","recommend the implant","should the surgeon"],refusal:"I cannot make or suggest clinical decisions. Sizing and technique belong to the surgeon.",allowed:"I can confirm which sizes and instrument sets are on site for the case."},{id:"ref-claims",guardrail:"all1",patterns:["better than","longer lasting","safer than","reduces infection","proven to","clinical evidence","outcomes better"],refusal:"I only use approved claims from the instructions for use and approved materials.",allowed:"I can show the instructions for use and approved material for this device."},{id:"ref-price",guardrail:"order1",patterns:["quote a price","contract price","discount on","best price","lower the price","price match"],refusal:"I cannot set or suggest contract prices or terms. The contracts team does.",allowed:"I can record that a renewal is due and show what the contracts team needs."},{id:"ref-complaint",guardrail:"gap1",patterns:["root cause","what caused","cause of the failure","is it a defect","blame","admit fault"],refusal:"I do not suggest a cause for a device complaint. That is for the quality team.",allowed:"I can list the facts to collect: lot number, what happened and when, and who reported it."}]};var ma={companion:{roles:{rep:"Territory manager",manager:"Regional sales manager"},expenseCategories:[{id:"fuel",label:"Fuel and tolls",limitClass:"travel"},{id:"parking",label:"Parking at hospitals",limitClass:"travel"},{id:"meals",label: apability:"ranking"},{title:"Case support clashes with everything else",text:"Cases are booked late. The rest of the week gets rebuilt by hand each time.",capability:"planning"},{title:"Reorders depend on someone remembering",text:"OR managers order when they notice. We find out about a shortage after it happens.",capability:"order"},{title:"We cannot show the support we gave",text:"Training sign-offs, case support and complaint follow-ups live in notes and email.",capability:"evidence"}],assistant:[{q:"Which accounts are behind on consumable pull-through?",a:"The installed accounts where usage is below plan. The Gap agent ranks those reorders first today."},{q:"Can I tell the surgeon which size to use?",a:"No. Sizing and clinical choices belong to the surgeon. You confirm what is on site and how the product works."},{q:"How do I renew a service contract?",a:"Start the renewal from the order screen. The contracts team sets the price and sends the offer."},{q:"Why is this lab on today's plan?",a:"Its analyzer logged unplanned stops and reagent stock is low. Both are fixable in one visit."},{q:"What should I do with a device complaint?",a:"Collect the lot number and what happened, log it, and tell the stakeholder when quality will reply. Do not guess the cause."},{q:"What happens when I override an item?",a:"It goes to your regional sales manager with your reason. It is feedback for the agents, not a mark against you."},{q:"When does the value analysis committee meet?",a:"The date and the open questions are on the hospital account page."},{q:"How sure is the agent about the consignment gap?",a:"Each item shows a confidence level. Low confidence means the usage data is incomplete. Count before acting."}],storyline:["Pick Medical devices and the prospect's country. Say it is sample data.","Today: the territory manager's visits across hospitals, surgery centers and labs, ranked by value.",'Open the first brief. Approve the case support item. Override one with "Contract u ardrailWhy:"This assistant follows responsible marketing, local licensing and age rules before any sales suggestion.",todayActivation:"The best candidates are bars and hotels with no event booked before the next holiday, steady sales and a manager who answers. The planner lists them in the brief with the date to book by. Every activation follows responsible marketing rules.",briefLicense:"Each {account} holds its own license, with its own hours and limits. Check that an event is covered before you plan it. The agent never suggests anything that would break local licensing, and licensing rules come before any suggestion.",orderKeg:"More than about two weekends of expected sales. Kegs go off, and a full cold room hides a problem with the lines. The draft is built from weekend sales and days left on the current keg, so it will not load the {account}.",routeService:"Before evening service, between lunch and dinner. The manager has time then and the bar is quiet enough to check the lines. A visit during service wastes both of your time.",managerKam:"The ones with an exclusive supply contract with another brand, and hotels with several outlets. Those need a decision at group level, not a coaching note to the {rep}.",agentsAge:"The agent reminds the {account} to display age-check signs and to check ID. It never aims marketing at anyone under the legal drinking age, and an activation brief always includes the responsible service points."},assistantRefusals:[{id:"ref-age",guardrail:"all1",patterns:["under 18","under 21","underage","under age","teenagers","minors","students only"],refusal:"I never suggest marketing aimed at people under the legal drinking age.",allowed:"I can show the responsible service points for an activation night."},{id:"ref-license",guardrail:"all2",patterns:["without a licen","serve after","after hours","bypass the licen","around the licen"],refusal:"Local licensing rules come first, so I cannot suggest anything that works around them.",allowed:"I can :25,summary:"Dates, staffing, license cover and the responsible service briefing."},{id:"m5",title:"Cooler placement and purity",minutes:15,summary:"Where it goes, power, and what the signed form says."},{id:"m6",title:"Training bar staff on a serve",minutes:15,summary:"The perfect serve, age checks and refusing service."},{id:"m7",title:"Keg rotation and weekend cover",minutes:15,summary:"Order for about two weekends and no more."},{id:"m8",title:"Visiting before service",minutes:10,summary:"Why afternoons work, and how to use the time."},{id:"m9",title:"Hotels and several outlets",minutes:20,summary:"Who decides across outlets and how to keep each {contact} informed."}],knowledge:[{id:"k1",title:"What does the outlet license allow?",text:"Each {account} holds its own license, with its own hours and limits. Check that an event is covered before you plan it. If you are not sure, ask the {contact} and your {manager}."},{id:"k2",title:"How often should draught lines be cleaned?",text:"The standard is weekly. The draught action shows the last clean date. Book the cleaning service if the date is old or the pour looks wrong."},{id:"k3",title:"How do I plan an activation night?",text:"Offer two dates, agree staffing with the {contact}, confirm the license covers the event and brief staff on responsible service. Never aim it at anyone under the legal age."},{id:"k4",title:"How much stock should an {order} cover?",text:"About two weekends of expected sales. The draft uses weekend sales and days left on the current keg. More than that spoils and hides problems with the lines."},{id:"k5",title:"What do I do if I see an under-age sale?",text:"Remind the {contact} of the age-check rule, give them the signs, and tell your {manager}. The {account} is responsible for its license, and you protect the brand."},{id:"k6",title:"How do I ask for a cooler placement?",text:"Agree the location and the power point with the {contact}, explain the purity terms before signing and photograph t y the credit and underwriting teams. A {order} line records interest only. Lines with a monthly fee show it. The agent never sets a price.",routeOffpeak:"Outside the lunch peak and the end-of-day cash count. Owners can focus when customers are not waiting, and a needs review takes about twenty quiet minutes.",managerKam:"The ones with a credit file under review, an {account} frozen by compliance, and small businesses with missed repayments. Those need a decision at account level.",agentsCredit:"The credit and underwriting teams decide. The agent never approves credit, sets a rate or pre-approves anything. It can help collect documents and record interest with consent."},assistantRefusals:[{id:"ref-credit",guardrail:"all1",patterns:["set the rate","interest rate to","what rate","approve the loan","approve credit","will they approve","will it be approved","loan be approved","get the loan","get approved","how much can they borrow","credit limit of","lower the rate"],refusal:"I never set a price or a rate, and I never approve credit. The credit team decides.",allowed:"I can list the documents to collect and record the owner's interest with consent."},{id:"ref-suitability",guardrail:"all2",patterns:["without consent","skip the needs review","skip suitability","no consent","push the loan","sell insurance","without the signature"],refusal:"Suitability and consent come before any product, so I cannot suggest skipping them.",allowed:"I can show what a needs review covers and where the consent is signed."},{id:"ref-collections",guardrail:"gap1",patterns:["threaten","pressure them","bully","forgive the debt","waive the arrears","write off","guarantee relief"],refusal:"Collections follow the fair treatment policy. I do not suggest pressure, and relief is decided by people.",allowed:"I can show the fair treatment steps for an early arrears conversation."},{id:"ref-promise",guardrail:"order1",patterns:["guarantee approval","promise approval","pre-approve","preapprove","confirm the loan"],refusal:"A {order} records interest and consent only. I cannot promise or confirm an outcome.",allowed:"I can show where the {order} goes next and who decides."}]};var Wa={companion:{roles:{rep:"Relationship officer",manager:"Branch sales manager"},expenseCategories:[{id:"fuel",label:"Fuel and tolls",limitClass:"travel"},{id:"parking",label:"Parking",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"courier",label:"Courier for signed documents",limitClass:"other"},{id:"lodging",label:"Overnight stay for a regional visit",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"licensing",label:"Sales licensing and conduct",cycleMonths:12},{id:"suitability",label:"Suitability and consent",cycleMonths:12},{id:"aml",label:"Anti-money laundering awareness",cycleMonths:12},{id:"fair",label:"Fair treatment in collections",cycleMonths:12},{id:"privacy",label:"Customer data privacy",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24}],learningModules:[{id:"m1",title:"Running a needs review",minutes:25,summary:"Questions about the business, a documented fit and signed consent."},{id:"m2",title:"Collecting documents for an application",minutes:15,summary:"The checklist, and why you never hint at an outcome."},{id:"m3",title:"Refreshing KYC documents",minutes:15,summary:"Originals only, scanned and stored."},{id:"m4",title:"Terminal health checks",minutes:10,summary:"Test payment, reset and when to swap a device."},{id:"m5",title:"Early arrears conversations",minutes:25,summary:"Listen first, follow the fair treatment script, leave relief to the collections team."},{id:"m6",title:"Agent outlet compliance",minutes:15,summary:"Fee chart, complaint notice and e-float limits."},{id:"m7",title:"Explaining fees from the approved sheet",minutes:15,summary:"Say what is on the sheet and nothing more."},{id:"m8",title:"Setting up QR payments",minutes:10,summary:"Stand ,99],target:98,segments:["merchant","agent"]},{id:"kyc",label:"KYC up to date",format:"pct",range:[85,100],target:100},{id:"arrears",label:"Accounts in early arrears",format:"pct",range:[1,7],target:3,lowerIsBetter:!0},{id:"suit",label:"Proposals with documented suitability",format:"pct",range:[90,100],target:100}],guardrails:[{id:"all1",agent:"all",text:"Never sets a price or a rate, and never approves credit."},{id:"all2",agent:"all",text:"Suitability and consent come before any product. No mis-selling."},{id:"gap1",agent:"gap",text:"Collections follow the fair treatment policy. Relief is decided by people."},{id:"order1",agent:"order",text:"Proposals record interest and consent only. Decisions belong to credit and underwriting."}],problems:[{title:"Officers visit the merchants they know",text:"Portfolio value and risk do not decide who gets a visit.",capability:"potential"},{title:"Terminals fail and we hear it from the complaint line",text:"Device problems are invisible to the field until the merchant gives up.",capability:"gaps"},{title:"Visits push products instead of solving needs",text:"Targets drive the conversation, which risks mis-selling and churn.",capability:"ranking"},{title:"Collections and service visits compete for the same day",text:"Officers plan by habit, so early arrears get late attention.",capability:"planning"},{title:"Proposals are copied from the last customer",text:"Products do not match the business, so take-up stays low.",capability:"order"},{title:"We cannot show suitability and consent for every sale",text:"Needs reviews live in notebooks. Audits find the gaps.",capability:"evidence"}],assistant:[{q:"Which merchants have failing terminals?",a:"Merchants with repeated failed connections this week. The Gap agent ranks them first."},{q:"Can I tell the business owner the loan rate?",a:"No. Rates and credit decisions belong to the credit team. You collect documents and record interest."},{q:"Why is this small business on my plan?",a:"Its card takings grew while cash fell. A needs review may show a fit. It is not a sale target."},{q:"Can I offer insurance on the first visit?",a:"Only after a needs review shows a fit and the owner gives consent."},{q:"What do I say at a collections visit?",a:"Listen first and follow the fair treatment script. Relief options are decided by the collections team."},{q:"What happens to my override?",a:"It goes to your branch sales manager with your reason. Overrides are feedback, never a penalty."},{q:"Which agent outlets ran out of e-float?",a:"Agents whose float ran dry in recent afternoons. They appear as e-float checks."},{q:"Is every proposal checked for suitability?",a:"Lines priced by people cannot be sent until the needs review is done and the business owner has signed consent. The proposal screen shows what is still missing."}],storyline:["Pick Financial services and the prospect's country. Say it is sample data.","Today: merchants, small businesses and agent outlets ranked by value.",'Open the first brief. Approve the terminal check. Override one with "Credit file under review".',"Open the proposal: sending is blocked until the needs review is done with signed consent. Follow the link to that action.","Run the needs review, capture the signature, mark it done, then send the proposal for approval.","Finish the visit, then switch to the branch sales manager. The override is with the senior relationship manager.","Agent controls: never sets price, never approves credit. Stop the Order agent.",'How this is configured: merchants, proposals, actions and KPIs. "A configuration, not a custom build."'],forbidden:["store","stores","SKU","SKUs","shelf","shopper","HCP","clinic","physician","prescriber","formulary","dealer","workshop","patient","farmer","planogram","promo"]};var La={assistantContext:Z({today:{rep:[{q:"Which {accounts} are about to change menu?",intent:"answer:todayMenu"}]},brief:{rep:[{q:"What does the supply contract allow here?",intent:"answer:briefContract"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why not phone in the usual {order}?",intent:"answer:orderUsual"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"What if the kitchen is in service?",intent:"answer:routeService"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Can an agent give an allergen answer?",intent:"answer:agentsAllergen"}],manager:[{q:"Can an agent give an allergen answer?",intent:"answer:agentsAllergen"}]}}),assistantAnswers:{talkToContact:"Start in the kitchen, not at the desk. Ask what is on the pass this week, listen for what is hard to source, and offer one thing that helps before you mention anything new. Keep it short: service starts soon.",goodVisit:"A good {visit} fits between services and ends with something agreed in writing: a sample, a spec sheet handed over, a standing order or a menu date. Count the store room, fix the top item, and leave an {order} that matches what the kitchen really uses.",guardrailWhy:"This assistant follows the contract price list and the rules your company set for the agents.",todayMenu:"Look for {accounts} where the menu changes within a few weeks and a new product has not been trialed. The menu action in each brief shows the timing and how similar {accounts} in the same area did. Offer a sample case and a cost per portion.",briefContract:"The supply contract sets prices, delivery days and minimum {order} sizes. The agent never suggests terms outside it. If the {contact} asks for more, log it and raise it with your {kam}.",orderUsual:"Phoning in the usual {order} keeps the range flat and misses seasonal peaks. The draft starts from the weekly average and the days of cover from the last count, then adds focus and new lines the kitchen has a dish for. You can change every line.",routeService:"If the kitchen is in service, move that {visit} to the quiet window after it. Use Mark closed today and the route re-plans. A short call after service beats a long wait at the back door.",managerKam:"The ones with overrides that cite the supply contract, and hotels or caterers with a blocked action. Those need a decision at account level, not a coaching note to the {rep}.",agentsAllergen:"No. Allergen and nutrition statements come only from the current spec sheet. An agent can remind the {rep} to hand over the sheet, and a person answers anything the sheet does not cover."},assistantRefusals:[{id:"ref-allergen",guardrail:"gap1",patterns:["is it gluten free","free from nuts","safe for allergies","allergen status","contains no nuts","vegan certified"],refusal:"I cannot make allergen or nutrition statements. Those come only from the spec sheet.",allowed:"I can remind you to hand over the current spec sheet and log a question it does not cover."},{id:"ref-terms",guardrail:"all1",patterns:["discount","lower price","special price","free case","side deal","rebate for","match their price"],refusal:"I cannot suggest prices or terms outside the contract price list.",allowed:"I can show what the contract allows and who to ask for an exception."},{id:"ref-load",guardrail:"order1",patterns:["stock them up","load the store room","overstock","push extra cases","fill their freezer","month end push"],refusal:"I do not plan stock beyond what the venue can store and use before the date code.",allowed:"I can show how the quantity was worked out and the days of cover from the last count."},{id:"ref-key",guardrail:"planner1",patterns:["drop this venue","remove the hotel","skip the caterer","stop visiting"],refusal:"I do not drop a hotel or caterer on a supply contract without your {manager}.",allowed:"I can show how the day re-plans if one stop is closed."}]};var Na={companion:{roles:{rep:"Sales rep",manager:"Regional manager"},expenseCategories:[{id:"fuel",label:"Fuel",limitClass:"travel"},{id:"parking",label:"Parking and loading bay fees",limitClass:"travel"},{id:"meals",label:"Meals on the road",limitClass:"meals"},{id:"samples",label:"Sample cases bought locally",limitClass:"other"},{id:"lodging",label:"Hotel for an overnight trip",limitClass:"lodging"},{id:"phone",label:"Phone and data for work",limitClass:"other"}],certifications:[{id:"foodhygiene",label:"Food hygiene for the delivery chain",cycleMonths:12},{id:"allergen",label:"Allergen awareness and spec sheets",cycleMonths:12},{id:"contract",label:"Supply contract and price list rules",cycleMonths:12},{id:"driving",label:"Safe driving and fatigue",cycleMonths:24},{id:"privacy",label:"Data privacy for field teams",cycleMonths:12}],learningModules:[{id:"m1",title:"Counting a store room in ten minutes",minutes:15,summary:"A fixed walk order for dry, chilled and frozen stock, so nothing is missed and the {contact} can follow."},{id:"m2",title:"Selling into a menu change",minutes:25,summary:"Find out the menu date early, bring a sample and a cost per portion, and agree when to call back."},{id:"m3",title:"Reading a spec sheet with a chef",minutes:20,summary:"Where the allergen table sits, what the sheet does not say, and when to log a question instead of guessing."},{id:"m4",title:"Fixing a short delivery at the root",minutes:20,summary:"Tell a stock allocation gap from a picking error, and give the {contact} a clear fix date."},{id:"m5",title:"Setting up a standing {order}",minutes:15,summary:"Choose lines with steady use, agree the cut-off day and show how to pause it."},{id:"m6",title:"Working with the {kam}",minutes:20,summary:"When to escalate a contract question and what to log so nothing is lost between teams."},{id:"m7",title:"Cold chain checks that hold up",minutes:15,summary:"Where the reading goes, what the photo must show, and what to do when a probe is missing."},{id:"m8",title:"Planning a day around service hours",minutes:15,summary:"Group calls by quiet window so each {visit} gets the {contact}'s full attention."},{id:"m9",title:"Seasonal and banquet planning",minutes:25,summary:"Use booking calendars to plan stock weeks ahead rather than on the day."}],knowledge:[{id:"k1",title:"How do I offer a sample case?",text:"Check the sample budget with your {manager}, tell the {contact} what is in the case and leave a feedback card. Log the sample so the product team can follow up on the result."},{id:"k2",title:"What counts as a valid receiving check?",text:"A temperature reading with the product, the time and the name of the person who received it, plus a photo of the log. A check without a reading cannot support a quality query."},{id:"k3",title:"Where do I find the current spec sheet?",text:"The product page holds the latest version with a date. Print it for the {contact} and ask for a signature. Never rely on an old copy from a previous visit."},{id:"k4",title:"What if the {contact} asks about an allergen?",text:"Show the allergen table on the spec sheet and read it with them. If the sheet does not answer the question, log it for the product team and tell the {contact} when to expect a reply."},{id:"k5",title:"How do I read days of cover?",text:"Days of cover is stock on hand divided by average daily use. Under about four days on a core line means order now. The {order} draft shows it for each line."},{id:"k6",title:"Who approves a large {order}?",text:"Orders above the approval limit go to your {manager}. The limit shows on the {order} screen, along with who it is waiting for."},{id:"k7",title:"What do I do about a short delivery?",text:"Log the delivery number, the line and the quantity short. Tell the depot lead the same day and give the {contact} a date for the replacement."},{id:"k8",title:"How should I log a refusal?",text:"Record the reason code, the name of the {contact} and the date. A refusal is useful data and is not a mark against you."},{id:"k9",title:"What is the right way to claim mileage?",text:"Take each trip start and end from the route plan. A claim uses the company mileage rate, in the distance unit of your country."},{id:"k10",title:"How do I prepare for a hotel or caterer {visit}?",text:"Open the {visit} brief, read the top three actions, bring the price list and spec sheets, and check the open items from the last {visit}."},{id:"k11",title:"What if the {contact} is unhappy?",text:"Listen first, write down what they say, fix what you can during the {visit} and tell your {manager} what you could not fix."}],pitchTemplates:[{id:"p1",uses:["kpi"],text:"On {kpi}, {name} is at {kpiValue} against a target of {kpiTarget}. Start there: it is the clearest gap in the store room."},{id:"p2",uses:["offer"],text:"{offer} could suit a dish already on the menu. Offer a sample case and agree a date with {person} to hear how it cooked."},{id:"p3",uses:["trend","event"],text:"The last {order} was {trend}. {event} is {eventDays} days away, so agree stock and delivery days for it now."}],valueStoryTemplates:[{id:"s1",title:"A steady kitchen supply",uses:["share","orderCount"],text:"{name} has captured {share} of its estimated potential. Across the last {orderCount} {orders}, the core lines were steady. The next step is to close the delivery gaps we found, one at a time, and review them together at the next {visit}."},{id:"s2",title:"A menu that moves with the season",uses:["offer","trend"],text:"The last {order} was {trend}. A trial of {offer} lets {person} test a new dish without changing the whole range, and the next {order} will show how it went."},{id:"s3",title:"Ready for the busy weeks",uses:["potential","share"],text:"Estimated potential at {name} is {potential} a year and the current figure is {current}. The gap of {whitespace} is an estimate from sample data. It is the reason to plan the busy weeks together."}],resourcePlans:[{id:"r1",name:"Seasonal menu launch",startWeek:1,weeks:3,perWeek:5},{id:"r2",name:"Spec sheet refresh round",startWeek:3,weeks:2,perWeek:4}],guardrails:[{id:"fg1",text:"Allergen and nutrition statements come only from the current spec sheet. The Companion never writes its own.",blocked:["allergen free","gluten free","safe for allergies","nut free","guarantee","no allergens"]},{id:"fg2",text:"Prices and terms follow the contract price list. Value stories use sample data and say so, and never claim a result.",blocked:["proven to","doubles sales","will boost","risk free","side deal","under the table"]}]}};var Ha={...La,...Na,id:"foodservice",name:"Foodservice distribution",tagline:"Restaurants, hotels, caterers and canteens",icon:"home",accent:"#047857",vocab:{account:"venue",accounts:"venues",contact:"buyer",contacts:"buyers",rep:"sales rep",reps:"sales reps",manager:"regional manager",kam:"national accounts manager",offering:"product",offerings:"products",order:"order",orders:"orders",visit:"visit",visits:"visits"},personas:{rep:"Sales rep",manager:"Regional manager",admin:"Commercial operations lead"},segments:[{id:"dining",name:"Restaurants and cafes",share:.45,visitMinutes:[15,25],style:"Quick call in the quiet hours between lunch and dinner, led by the chef's next menu change.",annualValue:[14e3,7e4],hours:[600,960],orderQty:[2,10],types:[{type:"Restaurant",words:{en:["Table","Eatery","Dining Room"],pt:["Cantina","Restaurante"],es:["Cocina","Fonda"],de:["Gasthaus","Speisehaus"],id:["Rumah Makan","Dapur"],fr:["Table","Bistrot Gourmand","Auberge"]}},{type:"Cafe",words:{en:["Coffee House","Cafe","Roasters"],pt:["Cafeteria","Padaria"],es:["Cafetería","Café"],de:["Kaffeehaus","Café"],id:["Kedai Kopi","Kafe"],fr:["Salon de Thé","Café","Torréfacteur"]}}],roles:["Head chef","Owner","Purchasing manager"]},{id:"hotels",name:"Hotels and caterers",share:.25,key:!0,visitMinutes:[30,45],style:"Planned call with the purchasing team, tied to the banquet calendar and the supply contract.",annualValue:[6e4,22e4],hours:[540,1020],orderQty:[6,24],types:[{type:"Hotel",naming:"institution",words:{en:["Grand Hotel","H ,price:30.6,unit:"case",status:"new"}],actions:[{id:"menu",type:"Place on the next menu",agent:"gap",effort:12,evidence:"note",value:[150,900],uses:"new",title:"Get {product} onto the next menu",saw:"The kitchen changes its menu in about {weeks} weeks and {product} is not on the shortlist.",compared:"{peers} similar venues in {city} added it to a menu within one cycle.",why:["Menu changes are the only time a new line gets a proper trial.","The cost per portion is in line with what this kitchen already uses.","Estimated value over the first quarter on the menu: {amount}."],talk:["Ask {person} which dishes are being reworked and offer a sample case.","Give the cost per portion on paper, not only the case price.","Agree a date to hear back before the menu is printed."]},{id:"shortship",type:"Fix repeat short deliveries",agent:"gap",effort:10,evidence:"note",value:[100,550],uses:"core",title:"Fix the repeat short deliveries on {product}",saw:"Delivery notes show {product} short on {n} of the last 8 deliveries.",compared:"Other venues on the same delivery route, which were short on one or two.",why:["A short delivery on a core line forces the kitchen to buy elsewhere that day.","The pattern points at a stock allocation gap, not at this venue.","Fixing it protects the standing order that comes with it."],talk:["Own the problem first, then ask {person} what a substitute cost them.","Log the delivery numbers and pass them to the depot lead."]},{id:"spec",type:"Hand over the spec sheet",agent:"gap",effort:8,evidence:"signature",value:[60,320],uses:"focus",title:"Hand over the spec sheet for {product}",saw:"The kitchen asked about {product} and no spec sheet is on file for this venue.",compared:"Venues that hold the spec sheet reorder more steadily than those that do not (sample data).",why:["Kitchens need allergen and storage details in writing before a new line goes on a menu.","The sheet is the only source for allergen statements. The rep does not improvise them.","A signed copy shows the venue received the current version."],talk:["Hand over the printed sheet and point to the allergen table.","If asked something the sheet does not cover, log it for the product team."],guardrail:"Allergen and nutrition statements come only from the current spec sheet. The agent never makes its own."},{id:"standing",type:"Set up a standing order",agent:"order",effort:10,evidence:"note",value:[200,1100],uses:"core",segments:["dining","canteens"],title:"Set up a standing order for {product}",saw:"{product} has been ordered in {weeks} of the last 8 weeks, in similar quantities each time.",compared:"This venue's own order history, which varies by less than a case a week.",why:["A standing order saves the buyer a call and the venue a stock-out.","The quantity comes from the last 8 weeks, not from a target.","It can be paused for closures and holidays."],talk:["Offer it as a convenience with an easy way to change it.","Agree the cut-off day for changes."]},{id:"cover",type:"Check stock room cover",agent:"order",effort:8,evidence:"photo",value:[120,600],uses:"core",title:"Check stock room cover before {event}",saw:"Counts from the last two visits show about {days} days of cover on {product}.",compared:"Expected demand in the weeks around {event}, {eventDays} days away.",why:["Busy weeks cause the most emergency orders.","A top-up is cheaper than an emergency delivery for both sides.","The photo records what was actually on the shelf."],talk:["Walk the store room with {person} and count together.","Order to the event, not to the month."]},{id:"trial",type:"Offer a tasting trial",agent:"gap",effort:15,evidence:"note",value:[100,500],uses:"new",segments:["dining","hotels"],title:"Offer a tasting trial of {product}",saw:"{product} launched {weeks} weeks ago and this kitchen has not tried it.",compared:"Trial-to-order rate for venues of this type in {area} and nearby (sample data).",why:["Chefs decide on taste and yield, not on a brochure.","A small trial case carries little risk for the venue.","Trial feedback goes straight back to the product team."],talk:["Ask {person} for the dish they would try it in first.","Leave a one-page feedback card with the sample.","Agree when to call back for the verdict."]},{id:"coldchain",type:"Check cold chain on delivery",agent:"gap",effort:10,evidence:"photo",value:[80,400],uses:"core",segments:["hotels","canteens"],title:"Check the cold chain on the chilled drop",saw:"The last two delivery checks for this venue have no temperature reading on the receiving log.",compared:"The receiving checklist agreed with this venue.",why:["A missing reading is the first thing an inspector asks about.","It protects the venue and the depot if a product is questioned.","The photo of the log is the record."],talk:["Show {person} where the reading goes on the receiving log.","If the venue has no probe, report it to the regional manager."]},{id:"seasonal",type:"Plan the seasonal stock-up",agent:"order",effort:12,evidence:"note",value:[250,1400],uses:"focus",segments:["hotels","canteens"],title:"Plan the stock-up for {event}",saw:"Banquet and cycle-menu bookings show higher covers in the weeks around {event}.",compared:"This venue's order volumes in the same weeks last year (sample data).",why:["Bookings are known weeks ahead, so stock can be planned, not rushed.","{product} is on the seasonal menu.","Early orders let the depot hold stock for this venue."],talk:["Go through the booking calendar with {person}.","Agree a plan with a review point, not a single big order."]},{id:"window",type:"Move the visit to a quiet window",agent:"planner",effort:3,evidence:"note",value:[30,120],uses:"none",title:"Move the next {visit} to the quiet window",saw:"{n} of the last four {visits} landed in the lunch rush.",compared:"The service hours this venue shared with the depot.",why:["Buyers give more attention between services.","A shorter {visit} in a quiet window beats a longer one in a rush.","It avoids a repeat {visit} to the same venue."],talk:["Ask {person} when the kitchen is calmest.","Confirm the new time by message the day before."]},{id:"invoice",type:"Log an open invoice query",agent:"gap",effort:6,evidence:"note",value:[20,140],uses:"none",title:"Log the open invoice query",saw:"The venue raised a query on its last statement and there is no reply on file.",compared:"The accounts team queue, where queries older than a week are flagged.",why:["Unanswered queries slow orders more than a price rise does.","The rep logs it. The accounts team resolves it.","The venue hears back sooner when the query has the invoice number."],talk:["Ask {person} for the invoice number and what looks wrong.","Tell them who will reply and by when."],guardrail:"The agent never changes an invoice, a credit note or a payment term. The accounts team does."}],orderReasons:{core:["Averages {avg} units a week. About {cover} days of cover left.","Ordered in most of the last {weeks} weeks.","Covers the shortfall found today."],focus:["Supports the plan for {event}.","Focus line this cycle. The kitchen has it on a dish."],new:["Trial quantity for {weeks} weeks.","Listed by similar venues nearby. Start with one case."]},orderRules:[{kind:"totalAbove",amount:2500,route:"manager",text:"{Orders} above {limit} need {manager} approval."},{kind:"info",text:"Prices come from the contract price list. The agent cannot change them."}],overrideReasons:[{label:"Buyer is away this week",route:"manager"},{label:"The kitchen already chose its supplier",route:"manager"},{label:"Not allowed under the supply contract",route:"kam"},{label:"The data looks wrong",route:"manager"},{label:"Not enough time in this visit",route:"manager"},{label:"Other",route:"manager"}],outcomeReasons:[{label:"Buyer said no",blocked:!1},{label:"Product out of stock at the depot",blocked:!0},{label:"Account on a credit hold",blocked:!0,route:"kam"},{label:"Kitchen too busy to talk",blocked:!1}],visitNotes:["Order taken, {n} lines.","Store room counted with the chef. Top-up agreed.","Buyer away. Order taken by phone.","Sample case left for the next menu meeting.","Spec sheet handed over and signed for."],kpis:[{id:"range",label:"Core range ordered",format:"pct",range:[55,95],target:85},{id:"fill",label:"Order fill rate",format:"pct",range:[82,99],target:96},{id:"lines",label:"Lines per order",format:"count",range:[4,16],target:12},{id:"menu",label:"Menu placements this quarter",format:"count",range:[0,5],target:3,segments:["dining","hotels"]},{id:"standing",label:"Standing orders in place",format:"pct",range:[20,80],target:60}],guardrails:[{id:"all1",agent:"all",text:"Follows the contract price list. Never suggests a price or terms outside it."},{id:"gap1",agent:"gap",text:"Allergen and nutrition statements come only from the current spec sheet."},{id:"order1",agent:"order",text:"Never suggests more stock than the venue can store and use before the date code."},{id:"planner1",agent:"planner",text:"Never drops a hotel or caterer on a supply contract without the regional manager."}],problems:[{title:"The biggest kitchens get the same call as the smallest",text:"Calls follow habit and the van route. Hotels and caterers with a large menu spend get a monthly call, while small cafes get a weekly one.",capability:"potential"},{title:"Short deliveries are found at the door",text:"The kitchen finds the gap when the driver leaves. By then the chef has bought the line from someone else.",capability:"gaps"},{title:"New lines wait for a menu that nobody planned for",text:"Menu changes are the one chance to get a new product tried. Reps usually hear about them after the menu is printed.",capability:"ranking"},{title:"Calls land in the lunch rush",text:"Fixed routes ignore service hours. The buyer is plating covers while the rep waits at the back door.",capability:"planning"},{title:"Orders are phoned in from memory",text:"Reps repeat last week's order. Seasonal peaks and new lines are not in it until the kitchen runs out.",capability:"order"},{title:"We cannot show what was agreed with the kitchen",text:"Spec sheets, sample trials and receiving checks are on paper or in the rep's head. A query months later has no record.",capability:"evidence"}],assistant:[{q:"Why is this venue first today?",a:"It has the most value across its actions and its order, and it is open for calls in the window before the next venue."},{q:"Which venues are due a menu conversation?",a:"The ones whose kitchens change menu within a few weeks and have a new product not yet trialed. The Gap agent ranks those first."},{q:"What should I say about a new product?",a:"Offer a sample case, give the cost per portion in writing, and agree when you will call back for the verdict."},{q:"Can I give an allergen answer from memory?",a:"No. Allergen and nutrition statements come only from the current spec sheet. Hand it over and log any question it does not cover."},{q:"How did the draft arrive at these quantities?",a:"From the venue's weekly average, the days of cover from the last count and the delivery cycle. You can change any line."},{q:"Where does an override go?",a:"It goes to your regional manager with your reason. An override is feedback for the agents, not a mark against you."},{q:"Which venues have I not seen for a month?",a:"Check the hotels and caterers with the longest gap. The Visit Planner puts them on the next routes."},{q:"Should I trust a low confidence item?",a:"Each item shows a confidence level. Low confidence means thin data, so check the store room before acting."}],storyline:["Pick Foodservice distribution and the prospect's country. Say it is sample data.","Today: the rep's venues, ranked by value, with local cities and currency.",'Open the first visit brief. Approve the menu action. Override the next with "Not allowed under the supply contract".',"Open an action: the reasons, the talking points and the spec sheet guardrail.","Order: change a line, then show the approval rule when the total passes the limit.","Complete the visit, then switch to the regional manager. The override is in the exception queue.","Agent controls: press stop on the Order agent and watch its lines pause in the brief.",'How this is configured: venues, products, actions and KPIs. "This is a configuration, not a custom build."'],forbidden:["patient","clinic","physician","dealer","farmer","loan","workshop"]};var Fa={assistantContext:Z({today:{rep:[{q:"Which {accounts} have a shutdown coming?",intent:"answer:todayShutdown"}]},brief:{rep:[{q:"What does the service agreement allow here?",intent:"answer:briefAgreement"}]},account:{rep:[{q:"How do I talk to the {contact} here?",intent:"global.talk"}]},action:{rep:[{q:"What should I say to the {contact}?",intent:"action.talk"}]},order:{rep:[{q:"Why not just ship the same box again?",intent:"answer:orderSame"}]},complete:{rep:[{q:"What does a good {visit} look like?",intent:"global.goodvisit"}]},route:{rep:[{q:"What if the line is down when I arrive?",intent:"answer:routeLine"}]},manager:{manager:[{q:"Which {accounts} need a {kam} conversation?",intent:"answer:managerKam"}]},agents:{rep:[{q:"Can an agent say a part is rated for a job?",intent:"answer:agentsRating"}],manager:[{q:"Can an agent say a part is rated for a job?",intent:"answer:agentsRating"}]}}),assistantAnswers:{talkToContact:"Go where the work is. Ask what failed or ran low this week, look at it together and agree one thing you can fix before you leave. Maintenance leads trust a rep who admits what they do not know and routes it to the technical desk.",goodVisit:"A good {visit} fits around the line, not through it. Count the crib, settle the urgent item first, record any datasheet question and leave an {order} that matches real use. End with a date for the next stock check.",guardrailWhy:"This assistant follows the contract price list, the maker datasheets and the rules your company set for the agents.",todayShutdown:"Look at {accounts} whose maintenance calendar shows a planned stop in h had fewer repeat reports (sample data).",why:["A ten-minute talk costs little compared with an incident.","The attendance sheet is the record that the talk was held.","The material comes from the maker, not from the rep."],talk:["Offer a slot at shift start and keep it to ten minutes.","Use the maker material and leave the handout with the supervisor."],guardrail:"Talks use the maker material only. The agent never adds safety advice of its own."},{id:"newitem",type:"Show a new item",agent:"gap",effort:12,evidence:"note",value:[150,800],uses:"new",title:"Show {product} to the team",saw:"{product} launched {weeks} weeks ago and the site buys the item it would replace.",compared:"{pct}% of similar sites in {city} have tried it, most within two orders.",why:["The new item solves a problem this site has logged more than once.","A trial unit lets the team test it on a real job.","The ordering code is already loaded for the site."],talk:["Describe the problem it solves before you describe the item.","Leave one unit with a short feedback form."]},{id:"crib",type:"Count the tool crib",agent:"order",effort:10,evidence:"photo",value:[100,550],uses:"core",segments:["plants","fab"],title:"Count the tool crib and top up {product}",saw:"The last count shows {product} at about {days} days of use, below the site minimum.",compared:"The minimum level agreed with this site and its consumption over 12 weeks.",why:["Stock-outs at the crib stop jobs and send the team to buy locally.","The count is cheap and the top-up is already drafted.","The photo shows the real level on the shelf at the time of the count."],talk:["Count with {person} and agree the figures before you order.","Keep the top-up to the agreed minimum, not above it."]},{id:"calibration",type:"Flag calibration due dates",agent:"gap",effort:8,evidence:"scan",value:[60,300],uses:"focus",segments:["plants","fab"],title:"Flag the calibration due dates on {product}",saw:"Scans of the tag on {n} units show a calibration date wit
