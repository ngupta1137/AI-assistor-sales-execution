/* ---- Action ---- */
.why { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: var(--s2); }
.guardrail { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border-radius: var(--radius-sm); background: var(--surface-subtle); border: 1px solid var(--line); border-left: 3px solid var(--accent); font-size: var(--text-sm); line-height: 20px; }
.guardrail .ic { color: var(--accent); margin-top: 1px; }
.evidence-tile { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border: 1px solid var(--control-line); border-radius: var(--radius-md); }
.evidence-tile.done { border-color: #BFE3CC; background: var(--good-bg); }
.photo-ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1); height: 120px; border-radius: var(--radius-md); background: repeating-linear-gradient(45deg, var(--surface-subtle), var(--surface-subtle) 10px, var(--surface-inset) 10px, var(--surface-inset) 20px); color: var(--muted); font-size: var(--text-sm); }
.sign { width: 100%; max-width: 320px; aspect-ratio: 8 / 3; height: auto; border: 1px dashed var(--control-line); border-radius: var(--radius-md); background: #fff; touch-action: none; display: block; }

/* ---- Order ---- */
.line { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.line.changed { background: var(--info-bg); }
.line-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.reason { display: flex; gap: var(--s1); align-items: flex-start; color: var(--ink-2); font-size: var(--text-sm); line-height: 20px; }
.reason .ic { margin-top: 2px; color: var(--muted); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--control-line); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
.step { width: var(--tap); height: var(--tap); border: 0; background: var(--surface); font-size: 20px; cursor: pointer; color: var(--accent); }
.step:disabled { color: var(--disabled-ink); background: var(--disabled-bg); cursor: not-allowed; }
.qty { min-width: 48px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.total-line b { font-size: var(--text-xl); line-height: 28px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.rules { list-style: none; margin: 0; padding: 0; }
.rule { display: flex; flex-direction: column; gap: var(--s1); padding: var(--s3) var(--s4); font-size: var(--text-sm); line-height: 20px; color: var(--ink-2); }
.rule a { font-weight: 600; }

/* ---- Manager ---- */
.exception { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.exception.ack { background: var(--surface-subtle); }
.ex-head { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.ex-head .time { margin-left: auto; font-size: var(--text-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-grid { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--s1) var(--s3); font-size: var(--text-sm); line-height: 20px; margin: 0; }
.ex-grid dt { color: var(--muted); }
.ex-grid dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
.ex-foot { display: flex; justify-content: flex-end; }
.coach { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); font-size: var(--text-sm); line-height: 20px; }
.coach .ic { color: var(--accent); margin-top: 2px; }

/* ---- Agents ---- */
.agent { padding: 0; }
.agent-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4); }
.agent-ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent); flex: none; }
.agent-body { padding: 0 var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.agent-body details { border-top: 1px solid var(--line-soft); }
.scope { margin: 0; font-size: var(--text-sm); line-height: 20px; padding-bottom: var(--s2); }
.scope dt { font-weight: 600; color: var(--ink-2); margin-top: var(--s3); }
.scope dd { margin: var(--s1) 0 0; }
.scope ul, .bullets { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: var(--s1); }
.guard-li { list-style: none; margin-left: -18px; display: flex; gap: var(--s2); align-items: flex-start; }
.guards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--s3); font-size: var(--text-sm); line-height: 20px; }
.guards li { display: flex; gap: var(--s2); align-items: flex-start; }
.guards .ic, .guard-li .ic { color: var(--accent); margin-top: 2px; }
.audit { list-style: none; margin: 0; padding: 0; font-size: var(--text-sm); line-height: 20px; }
.audit li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--s3); padding: var(--s2) 0; border-top: 1px solid var(--line-soft); }
.audit li:first-child { border-top: 0; }
.audit time { color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- Config and problems ---- */
.jump { display: flex; flex-wrap: wrap; gap: var(--s2); }
.jump a { display: inline-flex; align-items: center; min-height: var(--tap); padding: 0 var(--s3); border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: var(--text-sm); font-weight: 600; text-decoration: none; color: var(--ink-2); }
.screen section[id] { scroll-margin-top: var(--s4); }
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); line-height: 20px; }
.tbl th { text-align: left; font-size: var(--text-xs); font-weight: 600; color: var(--muted); padding: 0 var(--s2) var(--s2) 0; border-bottom: 1px solid var(--line); }
.tbl td { padding: var(--s2) var(--s2) var(--s2) 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; overflow-wrap: anywhere; }
.tbl tr:last-child td { border-bottom: 0; }
.problem { display: flex; flex-direction: column; gap: var(--s2); }
.problem .num { color: var(--muted); font-size: var(--text-xs); font-weight: 600; }

/* ---- Route ---- */
.timeline { list-style: none; margin: 0; padding: 0; }
.stop { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s3); padding: var(--s4); position: relative; }
.stop + .stop { border-top: 1px solid var(--line-soft); }
.stop .travel { display: flex; align-items: center; gap: var(--s1); font-size: var(--text-sm); color: var(--muted); }
.stop.done b { color: var(--muted); }

/* ---- Ask ---- */
.chips-q { display: flex; flex-direction: column; gap: var(--s2); }
.chip-q { min-height: var(--tap); padding: var(--s2) var(--s3); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); font-size: var(--text-sm); line-height: 20px; text-align: left; cursor: pointer; color: var(--ink); }
.chat { display: flex; flex-direction: column; gap: var(--s4); }
.msg { display: flex; flex-direction: column; gap: var(--s1); max-width: 90%; }
.msg small { font-size: var(--text-xs); font-weight: 600; }
.msg .bubble { padding: var(--s3); border-radius: var(--radius-md); font-size: var(--text-md); line-height: 24px; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.me .bubble { background: var(--accent-soft); border: 1px solid var(--accent-line); }
.msg.ai { align-self: flex-start; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--line); }
.ask-row { display: flex; gap: var(--s2); }
.ask-row .input { min-height: var(--tap); }

/* ---- Setup ---- */
.setup { overflow-y: auto; height: 100%; display: flex; flex-direction: column; }
.setup-scroll { flex: 1; overflow-y: auto; padding: var(--s5) var(--s4) var(--s6); }
.setup-scroll > * + * { margin-top: var(--s6); }
.setup-head { display: flex; flex-direction: column; gap: var(--s2); }
.setup-brand { display: flex; align-items: center; gap: var(--s2); font-weight: 700; }
.setup-brand .mark { background: var(--inverse-bg); }
.setup-head h1 { font-size: var(--text-xl); }
.setup-step { font-size: var(--text-md); font-weight: 600; margin-bottom: var(--s3); }
.choice-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.choice-list li + li { border-top: 1px solid var(--line-soft); }
.choice { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px; padding: var(--s2) var(--s4); background: var(--surface); border: 0; text-align: left; cursor: pointer; color: var(--ink); }
.choice .tile-ic { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--surface-inset); color: var(--ink-2); flex: none; }
.choice .txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.choice .txt b { font-size: var(--text-md); line-height: 22px; font-weight: 600; }
.choice .txt small { font-size: 13px; line-height: 18px; }
.choice .check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; color: #fff; }
.choice.on { background: var(--accent-soft); }
.choice.on .tile-ic { background: var(--tile); color: #fff; }
.choice.on .check { background: var(--accent); border-color: var(--accent); }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
.chip { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s3); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); text-align: left; }
.chip b { font-size: var(--text-sm); font-weight: 600; }
.chip small { font-size: var(--text-xs); }
.chip.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 0 11px; }
.personas { display: flex; flex-direction: column; gap: var(--s2); }
.persona { display: flex; flex-direction: column; align-items: flex-start; padding: var(--s3); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); min-height: var(--tap); }
.persona b { font-size: var(--text-md); font-weight: 600; }
.persona small { font-size: 13px; }
.persona.on { border: 2px solid var(--accent); background: var(--accent-soft); padding: 11px; }
.setup-foot { flex: none; padding: var(--s3) var(--s4) max(var(--s4), env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s2); }
.signin { font-size: var(--text-sm); line-height: 20px; color: var(--ink-2); }
.color-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; font-size: var(--text-sm); font-weight: 500; color: var(--ink-2); }
.color-row input[type="color"] { width: 48px; height: 44px; border: 1px solid var(--control-line); border-radius: var(--radius-sm); padding: 2px; background: var(--surface); }
.setup details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0 var(--s4); }
.setup details[open] { padding-bottom: var(--s4); }
.setup details .field + * { margin-top: var(--s3); }

/* ---- Presenter ---- */
.presenter-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 40; animation: fade var(--motion-base); }
.presenter { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); }
.presenter-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s2) var(--s2) var(--s2) var(--s4); border-bottom: 1px solid var(--line); }
.presenter-head > div { display: flex; align-items: center; gap: var(--s2); }
.presenter-body { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.presenter-actions { display: flex; flex-direction: column; gap: var(--s2); }
.presenter-actions .btn { justify-content: flex-start; }
.presenter hr { border: 0; border-top: 1px solid var(--line); margin: var(--s1) 0; }
.side-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
.story { list-style: none; padding: 0; margin: var(--s3) 0 0; display: flex; flex-direction: column; gap: var(--s1); counter-reset: step; }
.story li { counter-increment: step; }
.story a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s2); padding: var(--s2); border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; font-size: var(--text-sm); line-height: 20px; min-height: var(--tap); }
.story a::before { content: counter(step); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.story li.current a { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.side-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s2); margin-top: var(--s4); }
.side-switch .btn { padding-left: var(--s1); padding-right: var(--s1); font-size: 13px; }
</style>
</head>

idence:"photo",value:[300,1500],uses:"focus",segments:["super","conv"],title:"Secure an aisle-end display for {product}",saw:"No secondary display for {product} in the last {weeks} weeks of visit photos.",compared:"Stores in this group with a display sold {pct}% more of the line in display weeks (sample data).",why:["{event} is {eventDays} days away and display space gets booked early.","The retailer agreement allows one supplier display per aisle end.","The display kit and price cards are already in the car.","Estimated value over the display period: {amount}."],talk:["Ask for the aisle end near the entrance for two weeks.","Offer to build the display yourself during this visit.","Check the promo price is already loaded in the store system."],guardrail:"Display terms follow the retailer agreement. The agent never offers extra money or free goods."},{id:"listnew",type:"List a new product",agent:"gap",effort:12,evidence:"note",value:[200,900],uses:"new",title:"Get {product} listed",saw:"{product} launched {weeks} weeks ago and is not in this store's range.",compared:"{pct}% of similar stores in {city} have listed it, most within six weeks.",why:["Launch support (price card and shelf strip) is available this month only.","Shoppers here buy the parent brand heavily.","Listing needs one facing. No current line has to go."],talk:["Share the sell-through from nearby stores as sample figures, not a promise.","Propose a trial of one case.","Agree where the facing goes before you order."]},{id:"promo",type:"Place promo material",agent:"gap",effort:8,evidence:"photo",value:[60,300],uses:"focus",title:"Put up promo material for {product}",saw:"The current promotion on {product} has no shelf strip or price card in the last photo.",compared:"Promotion weeks with material in place, across {peers} similar stores.",why:["The promotional price is live but shoppers cannot see it.","The material is approved by the retailer for this cycle.","It takes under ten minutes."],talk:["Ask {pe
