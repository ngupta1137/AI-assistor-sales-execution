<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistor for Sales Execution — Executive Pitch Deck</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-card: #1e293b;
      --surface-subtle: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: #334155;
      --line-soft: #1e293b;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --good: #10b981;
      --good-soft: rgba(16, 185, 129, 0.15);
      --warn: #f59e0b;
      --warn-soft: rgba(245, 158, 11, 0.15);
      --bad: #ef4444;
      --radius: 12px;
      --radius-sm: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header.deck-bar {
      height: 56px;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo span { color: var(--accent); }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: var(--surface-card);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--line); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #2563eb; }
    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .pill.good { background: var(--good-soft); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill.accent { background: var(--accent-soft); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .pill.warn { background: var(--warn-soft); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .progress-track {
      height: 3px;
      background: var(--line-soft);
      width: 100%;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 8.33%;
      transition: width 0.25s ease;
    }
    main.stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .slide-viewport {
      width: 100%;
      max-width: 1100px;
      min-height: 600px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      padding: 44px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .slide-eyebrow {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .slide-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 20px;
      color: #fff;
    }
    .slide-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .card {
      background: var(--surface-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 18px;
    }
    .card h4 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
    .card ul { padding-left: 18px; font-size: 13px; color: #cbd5e1; }
    .card li { margin-bottom: 4px; }
    .notes-drawer {
      margin-top: 24px;
      padding: 14px 18px;
      background: rgba(30, 41, 59, 0.7);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      font-size: 13px;
      color: #94a3b8;
      display: none;
    }
    .notes-drawer.open { display: block; }
    .notes-drawer b { color: #f8fafc; }
    table.slide-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 12px 0;
    }
    table.slide-tbl th, table.slide-tbl td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      text-align: left;
    }
    table.slide-tbl th { background: var(--surface-subtle); color: #fff; font-weight: 700; }
    table.slide-tbl td { background: var(--surface-card); }
    .slide-foot {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .kbd {
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-size: 11px;
    }
    @media (max-width: 800px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .slide-viewport { padding: 24px; min-height: 500px; }
      .slide-title { font-size: 22px; }
    }
  </style>
</head>

    let currentSlide = 0;
    let notesOpen = false;

    function renderSlide() {
      const s = slides[currentSlide];
      const vp = document.getElementById('viewport');
      vp.innerHTML = `
        <div class="slide-eyebrow">
          <span>${s.eyebrow}</span>
          <span class="kbd">${currentSlide + 1} / ${slides.length}</span>
        </div>
        <h2 class="slide-title">${s.title}</h2>
        <div class="slide-content">${s.content}</div>
        <div class="notes-drawer ${notesOpen ? 'open' : ''}" id="speaker-notes">
          <b>Speaker Notes:</b> ${s.notes}
        </div>
        <div class="slide-foot">
          <span>AI Assistor for Sales Execution · Confidential Enterprise Briefing</span>
          <span>Press <span class="kbd">←</span> <span class="kbd">→</span> or <span class="kbd">Space</span> to navigate · <span class="kbd">S</span> for notes</span>
        </div>
      `;
      document.getElementById('slide-indicator').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
      document.getElementById('progress-bar').style.width = `${((currentSlide + 1) / slides.length) * 100}%`;
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      document.getElementById('btn-next').disabled = currentSlide === slides.length - 1;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function toggleNotes() {
      notesOpen = !notesOpen;
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 's') {
        toggleNotes();
      }
    });

    renderSlide();
  </script>
